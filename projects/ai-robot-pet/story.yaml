no_go:
- Góc pop-up và workshop không kéo được khách quay lại
- Không đủ đơn đặt cọc ở mức giá dự kiến
- Bộ não tiếng Việt không đạt hoặc chi phí AI vượt giá gói kỹ năng
- Đội không làm toàn thời gian cho giai đoạn 0–1
console:
  context:
    headline: Robot pet AI đã bùng nổ ở Trung Quốc. Việt Nam đang ở vạch xuất phát.
    lead: Trong hai năm, robot pet AI thành ngành hàng tỷ đô ở Trung Quốc và có cả cửa hàng trải nghiệm. Ở Việt Nam, hàng Trung Quốc đang tràn vào, người trẻ đã quen AI, nhưng chưa có pet nào nói tiếng
      Việt và chưa có CLB robotics nào cho giới trẻ.
    timeline:
    - year: '2024'
      cn: AI toy 24,6 tỷ NDT · BubblePal bán vài nghìn máy/tháng
      vn: Chưa có gì
    - year: '2025'
      cn: 29 tỷ NDT · Fuzozo 300 nghìn máy · Ropet, Loona gọi vốn
      vn: 78% người dùng online đã dùng AI · trào lưu Labubu, xếp hàng mua đồ sưu tầm
    - year: '2026'
      cn: Hơn 30 tỷ NDT · Unitree mở cửa hàng trải nghiệm robot ở Bắc Kinh
      vn: Robot hút bụi +138% (hàng TQ > 90%) · AI vào mọi trường · chưa có robot pet tiếng Việt, chưa có CLB robotics
      now: true
    - year: '2030'
      cn: 85–100 tỷ NDT (dự báo)
      vn: Ai sẽ là thương hiệu robot pet + CLB đầu tiên của người Việt?
      future: true
  pains:
    headline: Bốn nhóm người đang thiếu đúng thứ hệ sinh thái này mang lại
    note: Chân dung minh hoạ ghép từ dữ liệu, không phải người thật.
    personas:
    - id: genz
      who: Linh, 24 tuổi · nhân viên văn phòng TP.HCM
      role: Người mua chính · tự trả tiền
      story: Sống một mình ở thành phố, mê đồ sưu tầm, từng xếp hàng mua Labubu. Muốn một 'bạn nhỏ' dễ thương biết nói chuyện, và một chỗ cuối tuần để chơi cùng bạn bè.
      facts:
      - v: 80%
        l: người dùng cốt lõi của Fuzozo là nữ trưởng thành
        src: Pedaily
      - v: 35%
        l: Gen Z Việt Nam dùng AI làm người tâm sự
        src: Kaspersky 2026
      - v: 79%
        l: người lớn đô thị nuôi thú cưng — túi chi cho bạn đồng hành
        src: VNA / TGM
      today: Mua đồ sưu tầm, nuôi thú cưng, đi cà phê mèo
      fails: Đồ sưu tầm không biết nói; thú cưng cần thời gian chăm sóc mà người đi làm không có
      img: ropet_ces
    - id: kid
      who: Bé Minh, 10 tuổi · Hà Nội
      role: Người chơi · bố mẹ trả tiền
      story: Mê robot nhưng về nhà chỉ có điện thoại. Mẹ muốn con học AI và luyện tiếng Anh mà không thêm màn hình, cuối tuần có chỗ cho con chơi có ích.
      facts:
      - v: 2,1–4,5 tr
        l: phụ huynh chi mỗi tháng cho tiếng Anh
        src: Tuổi Trẻ, n > 1.200
      - v: 72%
        l: phụ huynh không chấp nhận học hoàn toàn online
        src: Tuổi Trẻ
      - v: 2026-27
        l: AI vào mọi trường phổ thông, 12 tiết/lớp/năm
        src: QĐ 2422
      today: Trung tâm tiếng Anh, khu vui chơi, điện thoại
      fails: Không có đồ chơi AI nói tiếng Việt; khu vui chơi không dạy gì
      img: hanoi_robot
    - id: elder
      who: Bà Lan, 74 tuổi · Nghệ An
      role: Người dùng · con cái ở xa mua tặng
      story: Con cháu đi làm xa. Một chú pet nói giọng quê, nhắc uống thuốc và báo cho con biết hôm nay bà ổn — bằng gói kỹ năng 'chăm sóc ông bà' trên cùng một thiết bị.
      facts:
      - v: 14,8 triệu
        l: người từ 60 tuổi ở Việt Nam
        src: NSO
      - v: 16,4%
        l: người từ 80 tuổi sống một mình
        src: Human Geographies
      - v: ~14.500
        l: búp bê AI Hyodol đang dùng cho người già ở Hàn
        src: Korea Times
      today: Gọi điện vài lần mỗi tuần
      fails: Con cái không có tín hiệu gì giữa các cuộc gọi
      img: hyodol
    - id: team
      who: Nhóm kỹ thuật biết tiếng Trung
      role: Người làm ra hệ sinh thái
      story: Có kỹ năng làm phần cứng, AI và đàm phán trực tiếp với nhà máy Thâm Quyến. Thiếu vốn và một kế hoạch đủ thuyết phục để bạn bè có tiền cùng góp.
      facts:
      - v: ~61 USD
        l: giá về kho một bộ pet để bàn (OEM)
        src: Alibaba / research/02
      - v: 0%
        l: thuế nhập khẩu với C/O form E
        src: caselaw.vn HS 9503
      - v: '> 1.500'
        l: nhà sản xuất AI toy ở TQ để chọn đối tác
        src: MIT Technology Review
      today: Làm thuê, hoặc tự nhập hàng bán lẻ nhỏ lẻ
      fails: Bán lẻ thuần dễ bị sao chép, đua giá với hàng sàn
      img: canton
  gap:
    headline: Ở Trung Quốc đã có cả ngành. Ở Việt Nam, mọi tầng của hệ sinh thái còn trống.
    compare:
    - l: Robot pet AI nói tiếng mẹ đẻ
