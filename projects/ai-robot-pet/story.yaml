title: Hệ sinh thái AI Robot Pet Việt
kicker: Báo cáo khai phá · Robot pet AI + CLB robotics + học viện + nhượng quyền
thesis: Pet AI tháo rời não–thân mang thương hiệu Việt, não chạy server Việt Nam. Chuỗi CLB robotics để chơi, huấn luyện, thi đấu, nâng cấp; học viện dạy huấn luyện prompt và lập trình pet; rồi nhượng quyền
  cả mô hình. Mỗi pet bán ra mở một dòng chi tiêu kéo dài nhiều năm.
verdict:
  level: caution
  field: Đáng khai phá
  invest: Đầu tư giai đoạn kiểm chứng trước
  why: 'Robot pet AI đã thành ngành lớn ở Trung Quốc; điểm yếu chết người của cả ngành là người dùng chán sau vài tuần — và CLB, thi đấu, huấn luyện, nâng cấp chính là lời giải. Ba điều cần chứng minh trong
    8–12 tuần: người trẻ chịu mua ở mức giá dự kiến, góc trải nghiệm kéo được khách quay lại, bộ não tiếng Việt chạy ổn với chi phí AI thấp.'
