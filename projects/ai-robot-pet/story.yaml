      cn: Pop Mart biên gộp 72%
      vn: Có Pop Mart, chưa có đồ sưu tầm biết nói
    - l: Học huấn luyện AI / prompt cho giới trẻ
      cn: Phổ biến trong trường và trung tâm
      vn: AI vào trường 2026-27, thiếu giáo cụ
    - l: Sửa chữa, nâng cấp robot tiêu dùng
      cn: Mạng lưới dịch vụ hãng
      vn: Hãng TQ chưa có dịch vụ ở VN
    pools:
    - seg: kids
      l: Robot/đồ chơi thông minh cho trẻ (HN+HCM)
      lo: 455
      hi: 455
    - seg: academy
      l: Khoá học AI-robotics (HN+HCM)
      lo: 2300
      hi: 2300
    - seg: edu
      l: Trường học HN+HCM (một lần)
      lo: 855
      hi: 855
    - seg: elder
      l: Chăm sóc người cao tuổi bằng thiết bị
      lo: 1300
      hi: 3900
  solution:
    headline: Một hệ sinh thái 4 tầng — mỗi tầng giữ chân và bán cho tầng kia
    lead: 'Mua thân máy rẻ ở Thâm Quyến, lắp ráp tại Việt Nam, tự làm phần khó sao chép: bộ não tiếng Việt, thương hiệu và thân sưu tầm, CLB, học viện.'
    chain:
    - pain: Robot pet bị chán sau vài tuần (trả hàng 30–40% ở TQ)
      fix: CLB + giải đấu + huấn luyện + thân mới cho lý do quay lại mỗi tuần
      edge: Cả hệ sinh thái, hàng sàn không sao chép được
      proof: Ropet giữ 80–90% người dùng sau 90 ngày
    - pain: Người trẻ muốn bạn đồng hành, đồ sưu tầm, chỗ chơi
      fix: Pet tháo rời não–thân, thân/skin sưu tầm, góc trải nghiệm
      edge: IP riêng + não nói tiếng Việt
      proof: Pop Mart biên gộp 72%; Fuzozo 300 nghìn máy
    - pain: Phụ huynh muốn con học AI, tiếng Anh, không thêm màn hình
      fix: Học viện huấn luyện prompt, lập trình pet; gói kỹ năng tiếng Anh
      edge: Cùng một thiết bị; giáo án theo chương trình AI của Bộ
      proof: 72% phụ huynh không muốn học hoàn toàn online
    - pain: Nhóm kỹ thuật có năng lực nhưng thiếu vốn
      fix: Nguồn hàng TQ rẻ + thuế 0% + nhượng quyền nhân rộng bằng vốn của đối tác
      edge: Đội nói tiếng Trung, OEM số lượng nhỏ
      proof: Build-A-Bear có 109 điểm nhượng quyền
    bodies:
    - Thân bánh xe
    - Thân chó 4 chân
    - Thân thú bông
    - Đế để bàn
    - Kit giáo dục
    layers:
    - n: '1'
      t: Pet tháo rời não–thân
      d: OEM thương hiệu riêng · lắp ráp VN · não chạy server VN · thân, skin, gói kỹ năng
    - n: '2'
      t: CLB robotics
      d: Góc trải nghiệm trước, CLB flagship sau · chơi, F&B, thi đấu có thưởng
    - n: '3'
      t: Học viện & dịch vụ
      d: Huấn luyện prompt, lập trình pet · giáo án cho trường · sửa chữa, nâng cấp, trang trí
    - n: '4'
      t: Nhượng quyền
      d: Khi CLB đầu có lãi ≥ 1 năm · phí ban đầu + phí theo doanh thu
  benefits:
    headline: Ai được lợi, và lợi nhuận đột phá nằm ở đâu
    stakeholders:
    - who: Người trẻ & gia đình
      gain: Bạn đồng hành nói tiếng Việt, chỗ chơi cuối tuần có ích, con học AI không thêm màn hình
    - who: Ông bà & con cái ở xa
      gain: 'Cùng một pet, gói kỹ năng chăm sóc ông bà: trò chuyện, nhắc thuốc, báo tin'
    - who: Đối tác nhượng quyền
      gain: Mô hình kinh doanh trải nghiệm đã chạy, có sản phẩm độc quyền để bán kèm
    - who: Nhà đầu tư
      gain: Nhiều dòng tiền trên cùng một khách; rủi ro giới hạn theo từng cửa ải
