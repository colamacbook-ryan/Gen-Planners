# SINGLE SOURCE OF TRUTH — AI Robot Pet → "Bộ não AI tiếng Việt cho thiết bị"
# status: placeholder → estimate → verified. Tiền: triệu đ. Năm 1 = 2027.
# Dữ kiện thị trường (fact_*) là số đã có nguồn; giả định kinh doanh (còn lại) là ước tính cần kiểm chứng ở Giai đoạn 0.
meta:
  currency: VND
  unit_label: triệu đ
  start_year: 2027
  years: 5
  fx_usd: 26000

assumptions:
  # ---------------------------------------------------------------- dữ kiện thị trường
  fact_cn_aitoy_2025:   {label: Thị trường AI toy TQ 2025, value: 29, unit: tỷ NDT, status: verified, confidence: medium, source: [ev-caixin-aitoy]}
  fact_cn_aitoy_2030:   {label: Thị trường AI toy TQ 2030 (dự báo cao), value: 100, unit: tỷ NDT, status: verified, confidence: low, source: [ev-mittr-aitoy]}
  fact_cn_aitoy_firms:  {label: Số công ty AI toy ở TQ, value: 1500, unit: công ty, status: verified, confidence: medium, source: [ev-mittr-aitoy]}
  fact_fuzozo_units:    {label: Fuzozo đã bán, value: 300000, unit: máy, status: verified, confidence: medium, source: [ev-pedaily-fuzozo], note: Doanh nghiệp tự công bố}
  fact_fuzozo_minutes:  {label: Fuzozo thời gian dùng TB, value: 50, unit: phút/ngày, status: verified, confidence: low, source: [ev-pedaily-fuzozo]}
  fact_fuzozo_female:   {label: Tỷ lệ nữ trong người dùng cốt lõi Fuzozo, value: 0.8, unit: "%", status: verified, confidence: low, source: [ev-pedaily-fuzozo]}
  fact_return_rate:     {label: Tỷ lệ trả hàng AI plush online ở TQ, value: 0.3, unit: "%", status: verified, confidence: medium, source: [ev-36kr-returns, ev-36kr-ropet]}
  fact_ropet_retention: {label: Ropet giữ chân người dùng sau 90 ngày, value: 0.8, unit: "%", status: verified, confidence: low, source: [ev-36kr-ropet], note: Tự công bố 80–90%}
  fact_doubao_devices:  {label: Thiết bị kết nối Doubao (06/2025), value: 1000000, unit: thiết bị, status: verified, confidence: medium, source: [ev-36kr-ropet]}
  fact_vn_60plus:       {label: Người 60+ ở VN (2025), value: 14.8, unit: triệu người, status: verified, confidence: high, source: [ev-nso-census]}
  fact_vn_60plus_2050:  {label: Người 60+ ở VN (2050), value: 28, unit: triệu người, status: verified, confidence: medium, source: [ev-unfpa-ageing]}
  fact_vn_aged_year:    {label: Năm VN thành xã hội già, value: 2036, unit: năm, status: verified, confidence: medium, source: [ev-unfpa-ageing]}
  fact_vn_abcd_hh:      {label: Hộ thu nhập ABCD, value: 15.8, unit: triệu hộ, status: verified, confidence: medium, source: [ev-cimigo-abcd]}
  fact_vn_schools:      {label: Trường phổ thông, value: 25900, unit: trường, status: verified, confidence: medium, source: [ev-nso-census], note: Nguồn Thời báo Tài chính 2024 trong research/04}
  fact_vn_toys:         {label: Thị trường đồ chơi VN 2025, value: 601.9, unit: triệu USD, status: verified, confidence: medium, source: [ev-imarc-toys]}
  fact_vn_vacuum:       {label: Thị trường robot hút bụi VN 12 tháng tới 06/2026, value: 92.5, unit: triệu USD, status: verified, confidence: medium, source: [ev-vacuum-vn]}
  fact_vn_vacuum_growth: {label: Tăng trưởng robot hút bụi VN, value: 1.376, unit: "%", status: verified, confidence: medium, source: [ev-vacuum-vn]}
  fact_vn_ai_users:     {label: Người dùng online VN đã dùng AI, value: 0.78, unit: "%", status: verified, confidence: medium, source: [ev-decisionlab-ai]}
  fact_vn_ai_paying:    {label: Người dùng AI trả phí thuê bao, value: 0.55, unit: "%", status: verified, confidence: low, source: [ev-decisionlab-ai]}
  fact_vn_pet_owners:   {label: Người trưởng thành đô thị nuôi thú cưng, value: 0.79, unit: "%", status: verified, confidence: medium, source: [ev-pet-vn]}
  fact_vn_english_spend_lo: {label: Chi tiêu tiếng Anh/tháng của phụ huynh (thấp), value: 2.1, unit: triệu đ, status: verified, confidence: low, source: [ev-english-parents]}
  fact_vn_english_spend_hi: {label: Chi tiêu tiếng Anh/tháng của phụ huynh (cao), value: 4.5, unit: triệu đ, status: verified, confidence: low, source: [ev-english-parents]}
  fact_vn_no_online:    {label: Phụ huynh không chấp nhận học hoàn toàn online, value: 0.72, unit: "%", status: verified, confidence: low, source: [ev-english-parents]}
