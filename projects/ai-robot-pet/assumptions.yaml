model:
  segments:
    elder: Người cao tuổi "Con cháu"
    english: Bạn luyện nói tiếng Anh
    brain: Nền tảng Bộ não AI tiếng Việt (B2B)
    edu: Giáo dục AI (STEM, trường tư)
    data: Dịch vụ dữ liệu giọng nói & embodied
    club: CLB trải nghiệm
  revenue_streams:
    - {id: elder_device, segment: elder, price: elder_price, volume: elder_units, cogs_pct: elder_device_cogs}
    - {id: elder_sub, segment: elder, price: elder_sub_price, volume: ["cum:elder_units", elder_active], cogs_pct: elder_sub_cogs}
    - {id: eng_device, segment: english, price: eng_price, volume: eng_units, cogs_pct: eng_device_cogs}
    - {id: eng_sub, segment: english, price: eng_sub_price, volume: ["cum:eng_units", eng_active], cogs_pct: eng_sub_cogs}
    - {id: brain_fee, segment: brain, price: brain_fee, volume: brain_devices, cogs_pct: brain_cogs}
    - {id: brain_int, segment: brain, price: brain_integration, volume: brain_brands, cogs_pct: brain_int_cogs}
    - {id: edu, segment: edu, price: edu_package, volume: edu_customers, cogs_pct: edu_cogs}
    - {id: data, segment: data, price: data_rev, volume: 1, cogs_pct: data_cogs}
    - {id: club, segment: club, price: club_rev, volume: club_venues, cogs_pct: club_cogs}
  opex:
    - {name: Nhân sự lõi, amount: opex_team}
    - {name: Marketing, amount: opex_marketing}
    - {name: Hợp quy & an toàn, amount: opex_compliance}
    - {name: Quản lý chung, amount: opex_ga}
    - {name: Vận hành CLB, amount: [club_venues, club_opex], segment: club}
  capex: capex_plan
  tax_rate: cit_rate
  funding: raise_amount
  pre_money: pre_money
  discount_rate: discount_rate
  exit_multiple: exit_multiple
  scenarios:
    bear: {volume_x: 0.5, opex_x: 0.9}
    base: {}
    bull: {volume_x: 1.5, opex_x: 1.1}
    no_brain: {stream_x: {brain_fee: 0, brain_int: 0}}
