# Dashboard số liệu. Nhóm "finance" do tools/export.py tự tính từ model.
# type: bar (vertical?, log?, refs?) | range | dots | funnel | line | stacked (percent?) | grouped | waterfall | donut
# status: actual | forecast | estimate | model. Mỗi chart: id, group, title, takeaway (khớp số!), unit, sources[{t,u}]
# Dữ liệu theo type (gen.py check kiểm cấu trúc này):
#   bar | dots | funnel | donut: items: [{label, value, tag?: ours|competitor}]   (bar: vertical?, log?, refs: [{label, value}])
#   range:                      items: [{label, lo, hi}]
#   line:                       series: [{name, points: [[x, y], …]}]
#   stacked | grouped:          categories: [..], series: [{name, values: [một số cho mỗi category]}]
#   waterfall:                  steps: [{label, value, kind?: total}]
# kpis: [{label, value, note?, status?}] — giá trị có dấu phẩy phải đặt trong ngoặc kép: value: "66,8 USD/m²"
groups:
  - {id: market, name: "Thị trường"}
  - {id: people, name: "Dân số & khách hàng"}
  - {id: demand, name: "Nhu cầu & hành vi"}
  - {id: cases, name: "Đối chiếu sản phẩm tương tự"}
  - {id: supply, name: "Chi phí & chuỗi cung ứng"}
  - {id: finance, name: "Vốn & lợi nhuận"}
kpis: []
charts: []
