<title>Gen Planner Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* Layout: investment memo canvas — one dark thesis band, then evidence → map → money → path → risk → verdict, each a full-width chapter. */
:root{
  --bg:#eff2f5; --surface:#ffffff; --sunk:#e6eaef; --line:#d9dfe6; --fg:#0f1720; --muted:#566273;
  --hero:#0c1a28; --hero-2:#13263a; --hero-fg:#eef3f8; --hero-muted:#9fb1c3; --hero-line:#25394f;
  --core:#0e7a6a; --wedge:#2d63b6; --cash:#b47618; --later:#7b8796; --drop:#b2402e;
  --ok:#22804f; --warn:#b47618; --bad:#b2402e;
  --s1:#0e7a6a; --s2:#2d63b6; --s3:#b47618; --s4:#7a4fa3; --s5:#6b7f22; --s6:#b2402e;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --wrap:1180px;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1018; --surface:#111a24; --sunk:#16212d; --line:#243242; --fg:#e6edf4; --muted:#93a3b5;
  --hero:#060d15; --hero-2:#0d1824; --hero-fg:#eef3f8; --hero-muted:#93a6ba; --hero-line:#1d2c3c;
  --core:#3cc2a8; --wedge:#6f9fe6; --cash:#e3a646; --later:#8e9aa9; --drop:#e5735f;
  --ok:#4cc483; --warn:#e3a646; --bad:#e5735f;
  --s1:#3cc2a8; --s2:#6f9fe6; --s3:#e3a646; --s4:#b28be0; --s5:#a6bd4f; --s6:#e5735f;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1018; --surface:#111a24; --sunk:#16212d; --line:#243242; --fg:#e6edf4; --muted:#93a3b5;
  --hero:#060d15; --hero-2:#0d1824; --hero-fg:#eef3f8; --hero-muted:#93a6ba; --hero-line:#1d2c3c;
  --core:#3cc2a8; --wedge:#6f9fe6; --cash:#e3a646; --later:#8e9aa9; --drop:#e5735f;
  --ok:#4cc483; --warn:#e3a646; --bad:#e5735f;
  --s1:#3cc2a8; --s2:#6f9fe6; --s3:#e3a646; --s4:#b28be0; --s5:#a6bd4f; --s6:#e5735f;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:var(--wedge)}
button{font:600 14px/1 var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer}
button.primary{background:var(--core);border-color:var(--core);color:#fff}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--wedge);outline-offset:2px}
.label{font:500 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hero);color:var(--hero-fg);border-bottom:1px solid var(--hero-line)}
.top .wrap{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:10px}
.brand{font:600 18px/1 var(--f-display);letter-spacing:.005em;margin-right:auto}
.brand span{color:var(--hero-muted);font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-left:10px}
.top select{font:500 14px var(--f-body);background:var(--hero-2);color:var(--hero-fg);border:1px solid var(--hero-line);border-radius:8px;padding:8px 10px;max-width:260px}
.seg{display:inline-flex;border:1px solid var(--hero-line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--hero-muted);padding:9px 12px}
.seg button[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero)}
.top .new{background:transparent;color:var(--hero-fg);border-color:var(--hero-line)}
/* hero */
.hero{background:linear-gradient(180deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-fg);padding-block:44px 34px}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:36px;align-items:start}
.kicker{color:var(--hero-muted)}
.hero h1{font:600 clamp(36px,5vw,60px)/1.02 var(--f-display);letter-spacing:-.02em;margin:10px 0 16px;text-wrap:balance}
.thesis{font:400 18px/1.6 var(--f-body);color:#d3dde7;max-width:62ch;margin:0}
.verdict{border:1px solid var(--hero-line);border-radius:12px;padding:20px;background:rgba(255,255,255,.03)}
.light{display:flex;gap:6px;margin-bottom:12px}.light i{width:12px;height:12px;border-radius:50%;background:var(--hero-line)}
.light .go{background:#3cc283}.light .caution{background:#e3a646}.light .stop{background:#e5735f}
.verdict .v1{font:600 22px/1.2 var(--f-display)}
.verdict .v2{font:600 15px/1.35 var(--f-body);color:#f0c27a;margin-top:4px}
.verdict p{font-size:13.5px;line-height:1.55;color:var(--hero-muted);margin:12px 0 0}
.heads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hero-line);border:1px solid var(--hero-line);border-radius:12px;overflow:hidden;margin-top:30px}
.heads div{background:var(--hero);padding:16px 18px}
.heads b{display:block;font:600 28px/1.1 var(--f-display);margin:6px 0 2px;color:#fff}
.heads span{font-size:12.5px;color:var(--hero-muted)}
.meter{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;font-size:12.5px;color:var(--hero-muted)}
.meter .bar{flex:1;min-width:180px;max-width:420px;height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--hero-line)}
.meter .bar i{display:block;height:100%}
/* chapters */
.chap{padding-block:46px;border-bottom:1px solid var(--line)}
.chap-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 40px;align-items:end;margin-bottom:24px}
.chap h2{font:600 clamp(26px,3vw,34px)/1.12 var(--f-display);letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
.chap-h p{margin:0;color:var(--muted);max-width:60ch}
.forces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.force{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.force .num{font:600 40px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.force .num small{font:500 13px var(--f-body);color:var(--muted);letter-spacing:0}
.force .arrow{color:var(--core);font-size:28px}
.force h3{font:600 15px/1.3 var(--f-body);margin:4px 0 0}
.force p{margin:0;font-size:13.5px;color:var(--muted)}
.src{font:500 11px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;align-self:flex-start;margin-top:auto}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
svg text{font:11px var(--f-mono);fill:var(--muted)}
svg .lbl{font:600 11.5px var(--f-body);fill:var(--fg)}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow .n{font:600 12px var(--f-mono);color:var(--muted)}
.orow b{font-weight:600;display:block}
.orow span.pay{font-size:12.5px;color:var(--muted)}
.pill{font:600 11px/1 var(--f-body);padding:5px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.r-core{background:var(--core)}.r-wedge{background:var(--wedge)}.r-cash{background:var(--cash)}.r-later{background:var(--later)}.r-drop{background:var(--drop)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chain{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 150px 96px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.layer.own{border-color:var(--core);box-shadow:inset 4px 0 0 var(--core)}
.layer b{font-weight:600}
.layer .who{font-size:13px;color:var(--muted)}
.mbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.mbar i{display:block;height:100%;background:var(--core)}
.stance{font:600 11.5px/1 var(--f-body);text-align:center;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.stance.own{background:var(--core);border-color:var(--core);color:#fff}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.segc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.segc .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.segc .t i{width:10px;height:10px;border-radius:3px;flex:none}
.segc b{font:600 24px/1.1 var(--f-display)}
.segc span{font-size:12.5px;color:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative}
.phase{padding:0 18px 0 0;display:flex;flex-direction:column;gap:10px}
.phase .dot{display:flex;align-items:center;gap:10px}
.phase .dot i{width:14px;height:14px;border-radius:50%;background:var(--core);flex:none}
.phase .dot hr{flex:1;border:0;border-top:2px dashed var(--line);margin:0}
.phase h3{font:600 20px/1.2 var(--f-display);margin:0}
.phase .meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:500 12px/1 var(--f-mono);background:var(--sunk);border-radius:6px;padding:6px 8px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.gate ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.gate li{margin:3px 0}
.heat{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,92px) 26px;gap:4px}
.heat .c{border-radius:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;padding:7px}
.heat .ax{font:500 10.5px var(--f-mono);color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.heat .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.rdot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:1.5px solid var(--fg);display:grid;place-items:center;font:600 11.5px var(--f-mono)}
.rlist{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.rlist div{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.rlist b{font-weight:600}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.card{flex:0 0 220px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph b{font:600 30px var(--f-display);color:var(--muted)}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1;font-size:13px}
.card h3{font:600 15px/1.25 var(--f-body);margin:0}
.card .price{font:600 13px var(--f-mono);color:var(--core)}
.card .muted{color:var(--muted)}
.card a{margin-top:auto}
.final{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.final .big{font:600 clamp(24px,2.6vw,30px)/1.25 var(--f-display);margin:0 0 12px}
.nogo li{margin:6px 0}

/* console — one deliberate dark world, tokens redefined locally so reused charts follow */
.con{--line:#213041;--muted:#8fa3b8;--fg:#e9eff6;--surface:#111c27;--sunk:#162433;--bg:#0a1119;
  --core:#3cc2a8;--wedge:#6f9fe6;--cash:#e3a646;--later:#7f8c9b;--drop:#e5735f;--ok:#4cc483;--warn:#e3a646;--bad:#e5735f;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --s1:#3cc2a8;--s2:#6f9fe6;--s3:#e3a646;--s4:#b28be0;--s5:#a6bd4f;--s6:#e5735f;
  color-scheme:dark;background:#0a1119;color:var(--fg);display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:1px;background-image:linear-gradient(#0a1119,#0a1119);min-height:calc(100vh - 58px)}
.con>section{background:#0c151f;min-width:0;padding-block:18px;padding-inline:18px}
.con .colL,.con .colR{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow-y:auto}
.con .k{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.con h1{font:600 30px/1.05 var(--f-display);margin:8px 0 10px;letter-spacing:-.01em}
.con .thesis{font-size:13.5px;line-height:1.55;color:#c4d0dc;margin:0}
.con .vd{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#0f1b27}
.con .vd .l{display:flex;gap:5px;margin-bottom:8px}.con .vd .l i{width:10px;height:10px;border-radius:50%;background:#26384b}
.con .vd .l .on.caution{background:#e3a646}.con .vd .l .on.go{background:#4cc483}.con .vd .l .on.stop{background:#e5735f}
.con .vd b{display:block;font:600 16px/1.25 var(--f-display)}.con .vd span{font-size:13px;color:#f0c27a;font-weight:600}
.con .kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.con .kp div{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#0f1b27}
.con .kp b{display:block;font:600 19px/1.15 var(--f-display);margin-top:3px}.con .kp small{font-size:11px;color:var(--muted)}
.con .kp .hot b{color:#3cc2a8}
.con .meter{margin-top:12px;font-size:11.5px;color:var(--muted)}
.con .meter .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#26384b;margin:6px 0}
.steps{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:st}
.steps button{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--fg);border-radius:9px;padding:9px 10px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.steps button .n{font:600 12px/24px var(--f-mono);width:24px;height:24px;border-radius:50%;text-align:center;border:1px solid var(--line);color:var(--muted)}
.steps button b{font:600 14px/1.3 var(--f-body);display:block}.steps button small{font-size:12px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.steps button[aria-current="step"]{background:#13283a;border-color:#2a4a66}.steps button[aria-current="step"] .n{background:var(--core);color:#06120e;border-color:var(--core)}
.stage h2{font:600 clamp(24px,2.4vw,32px)/1.12 var(--f-display);margin:6px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.stage .lead{font-size:15px;color:#c4d0dc;max-width:70ch;margin:0 0 18px}
.stage .nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.stage .nav button{background:#13283a;border-color:#2a4a66;color:var(--fg)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.tl{display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr));gap:6px;font-size:13px}
.tl .h{font:600 13px var(--f-mono);color:var(--muted);padding:6px 8px}
.tl .h.now{color:#3cc2a8}.tl .lane{font:600 12px var(--f-mono);color:var(--muted);display:flex;align-items:center}
.tl .c{border-radius:8px;padding:9px 10px;line-height:1.4;background:var(--surface);border:1px solid var(--line)}
.tl .c.cn{border-left:3px solid #e5735f}.tl .c.vn{border-left:3px solid #3cc2a8}.tl .c.now{background:#13283a;border-color:#2a4a66}.tl .c.fut{border-style:dashed;color:#f0c27a}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.fgrid .box b{font:600 24px/1.1 var(--f-display)}.fgrid .box b em{font-style:normal;color:#3cc2a8;margin:0 4px}.fgrid .box p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.persona{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pc .im{aspect-ratio:16/9;max-width:100%;background:#162433;overflow:hidden}.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc h3{font:600 17px/1.2 var(--f-display);margin:0}.pc .role{font-size:12px;color:#3cc2a8;font-weight:600}
.pc .story{font-size:13.5px;line-height:1.5;color:#c4d0dc;margin:0;border-left:2px solid #2a4a66;padding-left:10px}
.pc .fact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.pc .fact b{font:600 18px/1.1 var(--f-display);color:#f0c27a;white-space:nowrap}.pc .fact span{font-size:12.5px;line-height:1.35}
.pc .fact small{grid-column:2;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:-2px}
.pc .tf{font-size:12.5px;display:grid;gap:4px;margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.pc .tf div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px}.pc .tf .x{color:#e5735f}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp td.cn{color:#f3c0b6}.cmp td.vn{color:#3cc2a8;font-weight:600}
.pool{display:flex;flex-direction:column;gap:12px}
.pool .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.pool .r .tr{grid-column:1/-1;grid-row:2}
.pool .tr{position:relative;height:16px;border-radius:4px;background:#1c2e40;overflow:hidden}
.pool .tr i{position:absolute;inset:0 auto 0 0;background:#2a4a66}.pool .tr u{position:absolute;inset:0 auto 0 0;background:#3cc2a8;text-decoration:none}
.pool .v{font:500 12px var(--f-mono);text-align:right}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chain{display:flex;flex-direction:column;gap:8px}
.lay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}

<script>
const STAGES=[["01-intake","Ý tưởng"],["02-market","Thị trường"],["03-competitors","Đối thủ"],["04-customer","Khách hàng"],["05-product-supply","Sản phẩm"],["06-legal-tax","Pháp lý"],["07-business-model","Mô hình"],["08-gtm","Lộ trình"],["09-financials","Tài chính"],["10-deal","Vốn"],["11-risk","Rủi ro"],["12-pitch","Pitch"]];
const STATUS={done:"Hoàn thành",running:"Agent đang làm",queued:"Chờ agent"};
const ROLE={core:"Lõi giá trị",wedge:"Mũi nhọn",cash:"Dòng tiền sớm",later:"Để sau",drop:"Loại"};
const STANCE={buy:"Mua",reuse:"Dùng lại",partner:"Hợp tác",own:"Làm chủ",later:"Để sau"};
const MARGIN={low:22,mid:55,high:92};
const SEGC=["--s1","--s2","--s3","--s4","--s5","--s6"];
const S={db:null,user:null,dl:null,projects:[],cur:null,dossier:null,docs:null,view:"canvas",tab:"dossier",sec:0,flt:"all",unsub:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(s||"")):"<pre>"+esc(s)+"</pre>";
const vn=(x,d=0)=>Number(x).toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const ty=x=>vn(x/1000,1)+" tỷ";
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function slugify(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"du-an"}

/* ---------- charts ---------- */
function bubble(ops){
  const W=560,H=380,L=46,R=16,T=16,B=40;
  const x=v=>L+(W-L-R)*(v-0.5)/5, y=v=>T+(H-T-B)*(1-(v-0.5)/5);
  let g=`<rect x="${x(3)}" y="${y(5.5)}" width="${x(5.5)-x(3)}" height="${y(3)-y(5.5)}" style="fill:var(--core);fill-opacity:.07"/><text x="${x(5.4)}" y="${y(5.3)}" text-anchor="end" style="fill:var(--core)">VÙNG NÊN VÀO</text>`;
  for(let i=1;i<=5;i++){g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${y(i)}" y2="${y(i)}" stroke="var(--line)"/><text x="${x(i)}" y="${H-B+16}" text-anchor="middle">${i}</text><text x="${L-10}" y="${y(i)+4}" text-anchor="end">${i}</text>`}
  g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">THỜI ĐIỂM — đã chín muồi chưa →</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">QUY MÔ →</text>`;
  const grp={};ops.forEach((o,i)=>(grp[o.timing+"-"+o.size]=grp[o.timing+"-"+o.size]||[]).push(i));
  const pos={};Object.values(grp).forEach(ids=>ids.forEach((id,j)=>{const o=ops[id],m=ids.length,a=-Math.PI/2+2*Math.PI*j/m,rr=m>1?24:0;pos[id]=[x(o.timing)+rr*Math.cos(a),y(o.size)+rr*Math.sin(a)]}));
  ops.forEach((o,i)=>{const [cx,cy]=pos[i],r=6+o.defense*3.5;
    g+=`<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--${o.role});fill-opacity:.85;stroke:var(--surface);stroke-width:2"><title>${esc(o.name)} · quy mô ${o.size} · thời điểm ${o.timing} · khó sao chép ${o.defense} · hợp đội ${o.fit}</title></circle><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;font-weight:600">${i+1}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bản đồ cơ hội">${g}</svg><div class="legend">${Object.entries(ROLE).map(([k,v])=>`<span><i style="background:var(--${k})"></i>${v}</span>`).join("")}<span>· kích thước bong bóng = độ khó sao chép</span></div>`;
}
function stacked(fin){
  const b=fin.base,segs=b.segments,years=b.years.map(v=>v.year),n=years.length;
  const tot=years.map((_,i)=>segs.reduce((a,g)=>a+g.revenue[i],0)),max=Math.max(...tot)*1.12;
  const W=680,H=300,L=44,R=12,T=18,B=28,step=(W-L-R)/n,bw=step*.56,y=v=>T+(H-T-B)*(1-v/max);let g="";
  for(let k=0;k<=4;k++){const v=max/4*k;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${vn(v/1000,0)}</text>`}
  years.forEach((yr,i)=>{const cx=L+step*(i+.5);let acc=0;segs.forEach((s,j)=>{const v=s.revenue[i];if(v>0)g+=`<rect x="${cx-bw/2}" y="${y(acc+v)}" width="${bw}" height="${Math.max(0,y(acc)-y(acc+v))}" style="fill:var(${SEGC[j%6]})"><title>${esc(s.name)} ${yr}: ${ty(v)}</title></rect>`;acc+=v});
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${yr}</text><text class="lbl" x="${cx}" y="${y(acc)-6}" text-anchor="middle">${vn(acc/1000,1)}</text>`});
  const pts=b.years.map((v,i)=>[L+step*(i+.5),y(Math.max(v.ebitda,0))]);

function scen(fin){

  for(let k=0;k<=4;k++){const v=max/4*k;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${vn(v/1000,0)}</text>`}
  years.forEach((yr,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${yr}</text>`);

function legend(names,start=0){return `<div class="lg">${names.map((n,i)=>`<span><i style="background:${C(i+start)}"></i>${esc(n)}</span>`).join("")}</div>`}

  const vals=c.items.map(i=>i.value),max=Math.max(...vals,...(c.refs||[]).map(r=>r.value)),lg=c.log,mn=lg?Math.min(...vals.filter(v=>v>0))/2:0;
  const w=v=>lg?(v<=0?0:100*Math.log10(v/mn)/Math.log10(max*1.05/mn)):100*v/(max*1.05);
  return `<div class="hb">${c.items.map(it=>`<div class="hr"${tipA(`${it.label}: ${fmt(it.value)} ${c.unit}`)}><span class="lb">${esc(it.label)}</span><span class="tr">${(c.refs||[]).map(r=>`<i class="ref" style="left:${w(r.value)}%"></i>`).join("")}<i class="fl ${it.tag==="ours"?"ours":it.tag==="failed"?"failed":""} ${it.tag==="estimate"||it.tag==="forecast"?"est":""}" style="width:${Math.max(w(it.value),it.value>0?.8:0)}%"></i></span><span class="vl">${fmt(it.value)}</span></div>`).join("")}</div>
  ${(c.refs||[]).length?`<div class="lg">${c.refs.map(r=>`<span><i style="width:0;height:12px;border-left:2px dashed var(--fg);border-radius:0"></i>${esc(r.label)}: ${fmt(r.value)}</span>`).join("")}</div>`:""}`;
}
function ranges(c){
  const max=niceMax(Math.max(...c.items.map(i=>i.hi))*1.02),w=v=>100*v/max;
  return `<div class="hb">${c.items.map(it=>{const pt=it.lo===it.hi;return `<div class="hr"${tipA(`${it.label}: ${pt?fmt(it.lo):fmt(it.lo)+" – "+fmt(it.hi)} ${c.unit}`)}><span class="lb">${esc(it.label)}</span><span class="tr"><i class="axis"></i><i class="rg ${pt?"pt":""} ${it.tag==="ours"?"ours":""} ${it.tag==="estimate"?"est":""}" style="left:${w(it.lo)}%;width:${w(it.hi-it.lo)}%"></i></span><span class="vl">${pt?fmt(it.lo):fmt(it.lo)+"–"+fmt(it.hi)}</span></div>`}).join("")}</div><div class="nt" style="display:flex;justify-content:space-between;font:11px var(--f-mono);color:var(--muted)"><span>0</span><span>${fmt(max)} ${esc(c.unit)}</span></div>`;
}
function dots(c){
  const max=niceMax(Math.max(...c.items.map(i=>i.value))),w=v=>100*v/max;
  return `<div class="hb">${c.items.map(it=>`<div class="hr"${tipA(`${it.label}: ${fmt(it.value)} ${c.unit}`)}><span class="lb" style="${it.tag==="ours"?"font-weight:700;color:var(--core)":""}">${esc(it.label)}</span><span class="tr"><i class="axis"></i><i class="dot ${it.tag||""}" style="left:${w(it.value)}%"></i></span><span class="vl">${fmt(it.value)}</span></div>`).join("")}</div>
  <div class="lg"><span><i style="background:var(--core);border-radius:50%"></i>Sản phẩm của ta</span><span><i style="background:var(--c1);border-radius:50%"></i>Sản phẩm trên thị trường</span><span><i style="background:var(--later);border-radius:50%"></i>Đã đóng cửa</span></div>`;
}
function funnel(c){
  const max=c.items[0].value,mn=Math.min(...c.items.map(i=>i.value))/3,w=v=>Math.max(14,100*Math.log10(v/mn)/Math.log10(max/mn));
  return `<div class="fun">${c.items.map((it,i)=>`<div class="fr"${tipA(`${it.label}: ${vn(it.value)} ${it.unit}`)}><div class="ft"><b>${esc(it.label)}</b>${i?`<span>${vn(it.value/c.items[i-1].value*100,it.value/c.items[i-1].value<.01?2:0)}% bước trước</span>`:""}</div><div class="bx" style="width:${w(it.value)}%;background:${it===c.items.at(-1)?"var(--core)":"var(--c1)"}">${vn(it.value)} ${esc(it.unit)}</div></div>`).join("")}</div><div class="nt">Độ rộng theo thang logarit để nhóm nhỏ vẫn nhìn thấy</div>`;
}
function axisY(max,min,H,T,B,L,W,R){let g="";const st=niceStep((max-min)/4);min=Math.floor(min/st)*st;max=Math.ceil(max/st)*st;const y=v=>T+(H-T-B)*(1-(v-min)/(max-min)),nt=Math.round((max-min)/st);for(let k=0;k<=nt;k++){const v=min+st*k;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}if(min<0)g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--fg)" stroke-width="1.2"/>`;return [g,y]}
function lineC(c){
  const W=560,H=260,L=46,R=110,T=16,B=28,all=c.series.flatMap(s=>s.points),xs=all.map(p=>p[0]),x0=Math.min(...xs),x1=Math.max(...xs);
  let mx=Math.max(...all.map(p=>p[1]),...c.series.flatMap(s=>(s.band||[]).map(b=>b[2]))),mnv=Math.min(0,...all.map(p=>p[1]));
  const max=mx,min=mnv<0?mnv:0;const [g0,y]=axisY(max,min,H,T,B,L,W,R);const x=v=>L+(W-L-R)*(x1===x0?.5:(v-x0)/(x1-x0));
  let g=g0,lastX=-99;[...new Set(xs)].sort((a,b)=>a-b).forEach(v=>{if(x(v)-lastX<30)return;lastX=x(v);g+=`<text x="${x(v)}" y="${H-8}" text-anchor="middle">${v}</text>`});
  c.series.forEach((s,i)=>{const col=C(i);for(let j=1;j<s.points.length;j++){const a=s.points[j-1],b=s.points[j];g+=`<line x1="${x(a[0])}" y1="${y(a[1])}" x2="${x(b[0])}" y2="${y(b[1])}" style="stroke:${col}" stroke-width="2" ${b[2]==="forecast"?'stroke-dasharray="5 4"':""}/>`}
    (s.band||[]).forEach(b=>g+=`<line x1="${x(b[0])}" x2="${x(b[0])}" y1="${y(b[1])}" y2="${y(b[2])}" style="stroke:${col}" stroke-width="8" stroke-opacity=".25" stroke-linecap="round"${tipA(`${s.name} ${b[0]}: ${fmt(b[1])}–${fmt(b[2])} ${c.unit}`)}/>`);
    s.points.forEach(p=>g+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${p[2]==="forecast"?4:4.5}" style="fill:${p[2]==="forecast"?"var(--surface)":col};stroke:${col}" stroke-width="2"${tipA(`${s.name} ${p[0]}: ${fmt(p[1])} ${c.unit}${p[2]==="forecast"?" (dự báo)":""}`)}/>`);
    const e=s.points.at(-1);g+=`<text class="lbl" x="${x(e[0])+9}" y="${y(e[1])+4}">${esc(s.name.length>16?s.name.slice(0,15)+"…":s.name)} · ${fmt(e[1])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(c.title)}">${g}</svg>${c.series.length>1?legend(c.series.map(s=>s.name)):""}${all.some(p=>p[2]==="forecast")?`<div class="lg"><span>● thực tế</span><span>○ - - dự báo</span></div>`:""}`;
}
function vbars(c){
  const W=560,H=240,L=46,R=12,T=22,B=40,n=c.items.length,max=niceMax(Math.max(...c.items.map(i=>i.value))*1.05),[g0,y]=axisY(max,0,H,T,B,L,W,R),step=(W-L-R)/n,bw=Math.min(70,step*.55);
  let g=g0;c.items.forEach((it,i)=>{const cx=L+step*(i+.5),col=it.tag==="ours"?"var(--core)":it.tag==="failed"?"var(--later)":"var(--c1)";
    g+=`<path d="M${cx-bw/2},${y(0)} V${y(it.value)+4} q0,-4 4,-4 H${cx+bw/2-4} q4,0 4,4 V${y(0)} Z" style="fill:${col}" ${it.tag==="estimate"?'fill-opacity=".55"':""}${tipA(`${it.label}: ${fmt(it.value)} ${c.unit}`)}/><text class="lbl" x="${cx}" y="${y(it.value)-6}" text-anchor="middle">${fmt(it.value)}</text>`;
    const words=it.label.split(" "),l1=[],l2=[];words.forEach(w=>((l1.join(" ")+" "+w).length<18&&!l2.length?l1:l2).push(w));
    g+=`<text x="${cx}" y="${H-24}" text-anchor="middle">${esc(l1.join(" "))}</text><text x="${cx}" y="${H-11}" text-anchor="middle">${esc(l2.join(" "))}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(c.title)}">${g}</svg>`;
}
function stackedC(c){
  const W=560,H=260,L=46,R=12,T=16,B=34,n=c.categories.length,tot=c.categories.map((_,i)=>c.series.reduce((a,s)=>a+s.values[i],0));
  const val=(s,i)=>c.percent?s.values[i]/tot[i]*100:s.values[i];const max=c.percent?100:niceMax(Math.max(...tot)*1.08),[g0,y]=axisY(max,0,H,T,B,L,W,R),step=(W-L-R)/n,bw=Math.min(64,step*.56);
  let g=g0;c.categories.forEach((cat,i)=>{const cx=L+step*(i+.5);let acc=0;c.series.forEach((s,j)=>{const v=val(s,i);if(v>0){const y0=y(acc),y1=y(acc+v);g+=`<rect x="${cx-bw/2}" y="${y1+1}" width="${bw}" height="${Math.max(0,y0-y1-2)}" rx="2" style="fill:${C(j)}"${tipA(`${cat} · ${s.name}: ${fmt(s.values[i])}${c.percent?" ("+fmt(v)+"%)":" "+c.unit}`)}/>`}acc+=v});
    if(!c.percent)g+=`<text class="lbl" x="${cx}" y="${y(acc)-6}" text-anchor="middle">${fmt(acc)}</text>`;g+=`<text x="${cx}" y="${H-12}" text-anchor="middle">${esc(cat.length>22?cat.slice(0,21)+"…":cat)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(c.title)}">${g}</svg>${legend(c.series.map(s=>s.name))}`;
}
function groupedC(c){
  const W=560,H=250,L=52,R=12,T=18,B=40,n=c.categories.length,k=c.series.length,max=niceMax(Math.max(...c.series.flatMap(s=>s.values))*1.08),[g0,y]=axisY(max,0,H,T,B,L,W,R),step=(W-L-R)/n,bw=Math.min(34,step*.7/k);
  let g=g0;c.categories.forEach((cat,i)=>{const cx=L+step*(i+.5);c.series.forEach((s,j)=>{const x0=cx-bw*k/2+bw*j+1,v=s.values[i];g+=`<rect x="${x0}" y="${y(v)}" width="${bw-2}" height="${y(0)-y(v)}" rx="2" style="fill:${C(j)}"${tipA(`${cat} · ${s.name}: ${vn(v)} ${c.unit}`)}/><text class="lbl" x="${x0+bw/2-1}" y="${y(v)-5}" text-anchor="middle" style="font-size:10.5px">${vn(v)}</text>`});
    const parts=cat.split(" · ");g+=`<text x="${cx}" y="${H-24}" text-anchor="middle">${esc(parts[0])}</text><text x="${cx}" y="${H-11}" text-anchor="middle">${esc(parts[1]||"")}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(c.title)}">${g}</svg>${legend(c.series.map(s=>s.name))}`;
}
function waterfall(c){
  const W=560,H=260,L=46,R=12,T=20,B=40,n=c.steps.length;let acc=0;const bars=c.steps.map(s=>{if(s.kind==="total"){acc=s.value;return {s,a:0,b:s.value}}const a=acc;acc+=s.value;return {s,a,b:acc}});
  const max=niceMax(Math.max(...bars.map(b=>Math.max(b.a,b.b)))*1.05),[g0,y]=axisY(max,0,H,T,B,L,W,R),step=(W-L-R)/n,bw=Math.min(52,step*.62);let g=g0;
  bars.forEach(({s,a,b},i)=>{const cx=L+step*(i+.5),top=y(Math.max(a,b)),h=Math.abs(y(a)-y(b)),col=s.kind==="total"?"var(--c1)":"var(--later)";
    g+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(h,1)}" rx="2" style="fill:${col}"${tipA(`${s.label}: ${fmt(s.value)} ${c.unit}`)}/><text class="lbl" x="${cx}" y="${top-5}" text-anchor="middle">${s.value>0&&s.kind!=="total"?"+":""}${fmt(s.value)}</text>`;
    if(i<n-1)g+=`<line x1="${cx+bw/2}" x2="${cx+step-bw/2}" y1="${y(b)}" y2="${y(b)}" stroke="var(--muted)" stroke-dasharray="2 2"/>`;
    const w=s.label.split(" "),l1=[],l2=[];w.forEach(t=>((l1.join(" ")+" "+t).length<12&&!l2.length?l1:l2).push(t));g+=`<text x="${cx}" y="${H-24}" text-anchor="middle">${esc(l1.join(" "))}</text><text x="${cx}" y="${H-11}" text-anchor="middle">${esc(l2.join(" "))}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(c.title)}">${g}</svg><div class="lg"><span><i style="background:var(--c1)"></i>Tổng</span><span><i style="background:var(--later)"></i>Khoản trừ</span></div>`;
}
function donut(c){
  const tot=c.items.reduce((a,i)=>a+i.value,0),R=88,r=56,cx=110,cy=110;let a0=-Math.PI/2,g="";
  c.items.forEach((it,i)=>{const a1=a0+2*Math.PI*it.value/tot,gap=.012,s=a0+gap,e=a1-gap,lg=e-s>Math.PI?1:0,p=(rr,a)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
    g+=`<path d="M${p(R,s)} A${R},${R} 0 ${lg} 1 ${p(R,e)} L${p(r,e)} A${r},${r} 0 ${lg} 0 ${p(r,s)} Z" style="fill:${C(i)}"${tipA(`${it.label}: ${fmt(it.value)} ${c.unit} (${vn(it.value/tot*100,0)}%)`)}/>`;a0=a1});
  g+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font:600 20px var(--f-display);fill:var(--fg)">${fmt(tot)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle">${esc(c.unit)}</text>`;
  return `<div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center"><svg viewBox="0 0 220 220" width="100%" role="img" aria-label="${esc(c.title)}">${g}</svg><div class="hb">${c.items.map((it,i)=>`<div class="hr" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="lb"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${C(i)};margin-right:6px"></i>${esc(it.label)}</span><span class="vl">${fmt(it.value)}</span><span class="vl" style="color:var(--muted)">${vn(it.value/tot*100,0)}%</span></div>`).join("")}</div></div>`;
}
function tableOf(c){
  let h="",rows=[];
  if(c.items&&c.type!=="range"){h=`<tr><th>Hạng mục</th><th class="num">${esc(c.unit||"")}</th></tr>`;rows=c.items.map(i=>`<tr><td>${esc(i.label)}</td><td class="num">${vn(i.value)}${i.unit?" "+esc(i.unit):""}</td></tr>`)}
  else if(c.type==="range"){h=`<tr><th>Hạng mục</th><th class="num">Thấp</th><th class="num">Cao</th></tr>`;rows=c.items.map(i=>`<tr><td>${esc(i.label)}</td><td class="num">${fmt(i.lo)}</td><td class="num">${fmt(i.hi)}</td></tr>`)}
  else if(c.type==="line"){const xs=[...new Set(c.series.flatMap(s=>s.points.map(p=>p[0])))].sort();h=`<tr><th>Chuỗi</th>${xs.map(x=>`<th class="num">${x}</th>`).join("")}</tr>`;rows=c.series.map(s=>`<tr><td>${esc(s.name)}</td>${xs.map(x=>{const p=s.points.find(q=>q[0]===x);return `<td class="num">${p?fmt(p[1]):"—"}</td>`}).join("")}</tr>`)}
  else if(c.categories){h=`<tr><th>Chuỗi</th>${c.categories.map(x=>`<th class="num">${esc(x)}</th>`).join("")}</tr>`;rows=c.series.map(s=>`<tr><td>${esc(s.name)}</td>${s.values.map(v=>`<td class="num">${fmt(v)}</td>`).join("")}</tr>`)}
  else if(c.steps){h=`<tr><th>Bước</th><th class="num">${esc(c.unit)}</th></tr>`;rows=c.steps.map(s=>`<tr><td>${esc(s.label)}</td><td class="num">${fmt(s.value)}</td></tr>`)}
  return `<div class="scroll"><table class="data"><thead>${h}</thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function chartBody(c){switch(c.type){case"bar":return c.vertical?vbars(c):hbars(c);case"range":return ranges(c);case"dots":return dots(c);case"funnel":return funnel(c);case"line":return lineC(c);case"stacked":return stackedC(c);case"grouped":return groupedC(c);case"waterfall":return waterfall(c);case"donut":return donut(c);default:return ""}}
function card(c){return `<article class="cc" id="ch-${esc(c.id)}"><header><div><div class="label">${esc((S.dossier.dash.groups.find(g=>g.id===c.group)||{}).name||"")}</div><h3>${esc(c.title)}</h3></div><span class="st ${esc(c.status)}">${STL[c.status]||c.status}</span></header>
  <p class="tk">${esc(c.takeaway||"")}</p><div class="cb">${chartBody(c)}</div>${c.note?`<p class="nt">${esc(c.note)}</p>`:""}<div class="tbl" id="tb-${esc(c.id)}">${tableOf(c)}</div>
  <footer><span>Nguồn:</span>${(c.sources||[]).map(s=>s.u?`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`:`<span>${esc(s.t)}</span>`).join(" · ")}<button type="button" data-tbl="${esc(c.id)}">Bảng số</button></footer></article>`}
function dashboard(p,d){
  const ds=d?.dash;if(!ds)return `<div class="wrap" style="padding-block:50px"><div class="empty">Dashboard số liệu sẽ xuất hiện khi agent hoàn thành bộ dữ liệu của dự án.</div></div>`;
  const gs=ds.groups.filter(g=>ds.charts.some(c=>c.group===g.id)),f=S.dgrp||"all";
  const list=gs.filter(g=>f==="all"||g.id===f).map(g=>`<h3 class="gtitle">${esc(g.name)}</h3>`+ds.charts.filter(c=>c.group===g.id).map(card).join("")).join("");
  return `<div class="wrap"><div class="dash-top"><div class="label">Dashboard số liệu · ${ds.charts.length} biểu đồ · ${esc(p.name)}</div><h2>Mọi con số của lĩnh vực, trên một màn hình</h2>
  <p class="hint" style="margin:0">Mỗi biểu đồ ghi rõ là số thực tế, dự báo của bên thứ ba, ước tính của ta hay tính từ model. Bấm “Bảng số” để xem số gốc, rê chuột lên biểu đồ để xem chi tiết.</p>
  <div class="kgrid">${(ds.kpis||[]).map(k=>`<div class="kg"><span class="label">${esc(k.label)}</span><b>${esc(k.value)}</b><span>${esc(k.note)}</span><span class="st ${esc(k.status)}" style="align-self:flex-start">${STL[k.status]||""}</span></div>`).join("")}</div></div>
  <div class="chips" role="group" aria-label="Lọc nhóm">${[["all","Tất cả"],...gs.map(g=>[g.id,g.name])].map(([k,l])=>`<button type="button" data-g="${k}" aria-pressed="${f===k}">${esc(l)}</button>`).join("")}</div>
  <div class="cgrid">${list}</div></div>`;
}

/* ---------- detail ---------- */
function tabSection(docs,key){const s=(docs?.sections||[]).find(x=>x.key.startsWith(key));return s?`<div class="prose">${md(s.md)}</div>`:'<div class="empty">Phần này chưa có.</div>'}
function tabDossier(docs){const secs=docs?.sections||[];if(!secs.length)return '<div class="empty">Hồ sơ chưa được viết.</div>';const s=secs[Math.min(S.sec,secs.length-1)];
  return `<div class="toc">${secs.map((x,i)=>`<button type="button" data-sec="${i}" aria-pressed="${i===S.sec}">${esc(x.title)}</button>`).join("")}</div><div class="panel prose" style="max-width:none"><div class="prose">${md(s.md)}</div></div>`}
function tabAssumptions(d){if(!d)return '<div class="empty">Chưa có giả định.</div>';
  const list=d.assumptions.filter(a=>S.flt==="all"||a.status===S.flt||(S.flt==="fact"&&a.id.startsWith("fact_")));
  const f=[["all","Tất cả"],["fact","Dữ kiện thị trường"],["verified","Đã kiểm chứng"],["estimate","Ước tính"],["placeholder","Chưa có"]];
  return `<div class="filters">${f.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${S.flt===k}">${l}</button>`).join("")}</div><div class="panel scroll"><table class="data"><thead><tr><th>Giả định</th><th class="num">Giá trị</th><th>Đơn vị</th><th>Trạng thái</th><th>Nguồn</th><th>Ghi chú</th></tr></thead><tbody>
  ${list.map(a=>`<tr><td>${esc(a.label)}</td><td class="num">${Array.isArray(a.value)?a.value.map(v=>vn(v,v%1?2:0)).join(" · "):vn(a.value,a.value%1?3:0)}</td><td>${esc(a.unit)}</td><td><span class="chip c-${esc(a.status)}">${esc({verified:"kiểm chứng",estimate:"ước tính",placeholder:"chưa có"}[a.status]||a.status)}</span></td><td>${(a.source||[]).map(s=>`<code>${esc(s)}</code>`).join(" ")}</td><td class="hint">${esc(a.note||"")}</td></tr>`).join("")}</tbody></table></div>`}
function tabEvidence(d){if(!d)return '<div class="empty">Chưa có nguồn.</div>';return `<div class="panel">${d.evidence.map(e=>`<div class="ev"><code>${esc(e.id)}</code><div>${esc(e.title)}</div><div class="hint">${esc([e.publisher,e.date,e.type].filter(Boolean).join(" · "))}</div>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url.length>90?e.url.slice(0,90)+"…":e.url)}</a>`:""}</div>`).join("")}</div>`}
function tabFinance(d,docs){if(!d)return '<div class="empty">Chưa có số liệu.</div>';const b=d.fin.base,rows=[["Doanh thu","revenue"],["Lợi nhuận gộp","gross_profit"],["Chi phí vận hành","opex"],["EBITDA","ebitda"],["Lợi nhuận ròng","net_income"],["Capex","capex"],["Tiền cuối kỳ","cash_end"]];
  return `<div class="panel scroll"><table class="data"><thead><tr><th>Chỉ tiêu (tỷ đ) · cơ sở</th>${b.years.map(y=>`<th class="num">${y.year}</th>`).join("")}</tr></thead><tbody>${rows.map(([l,k])=>`<tr><td>${l}</td>${b.years.map(y=>`<td class="num">${vn(y[k]/1000,1)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="panel scroll" style="margin-top:16px"><table class="data"><thead><tr><th>Đóng góp theo mảng (tỷ đ)</th>${b.years.map(y=>`<th class="num">${y.year}</th>`).join("")}</tr></thead><tbody>${b.segments.map(g=>`<tr><td>${esc(g.name)}</td>${g.contribution.map(v=>`<td class="num">${vn(v/1000,1)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div style="margin-top:24px">${tabSection(docs,"09")}</div>`}
function tabDeck(docs){if(!docs?.deck)return '<div class="empty">Deck chưa có.</div>';const parts=docs.deck.split(/\n(?=## )/).filter(x=>x.trim().startsWith("## "));return `<div class="slides">${parts.map(p=>`<div class="slide prose">${md(p)}</div>`).join("")}</div>`}
function tabFiles(p){const files=[["business-plan.docx","Báo cáo khai phá","Word · toàn bộ hồ sơ có mục lục"],["deck.pptx","Pitch deck","PowerPoint · slide thuyết trình"],["financials.xlsx","Model tài chính","Excel · giả định, P&L, theo mảng, nguồn"],["business-plan.md","Hồ sơ Markdown","Để chỉnh sửa hoặc đưa cho AI khác"]];
  return `<p class="hint" style="margin-top:0">Cả bộ dựng từ cùng một nguồn số liệu · phiên bản ${esc(p.version||"—")}</p><div class="downloads">${files.map(([f,t,s])=>`<div class="dl"><b>${t}</b><span class="hint">${s}</span><button type="button" data-file="${f}">Tải ${f.split(".").pop().toUpperCase()}</button></div>`).join("")}</div><p class="hint" id="dlmsg"></p>`}
async function download(id,f){const m=$("#dlmsg");if(!S.dl){m.textContent="Trình xem này không cho tải file.";return}
  if(window.GP){location.href=`${window.GP.api}/projects/${id}/files/${f}`;m.textContent="Đang tải "+f;return}
  try{const bin=!f.endsWith(".md");const r=await fetch(`files/${id}/${f}${bin?".b64.txt":""}`);if(!r.ok)throw new Error("chưa có file");let blob;
    if(bin){const s=atob((await r.text()).trim()),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);blob=new Blob([u])}else blob=await r.blob();
    await S.dl.save({filename:`${id}-${f}`,data:blob});m.textContent="Đã gửi "+f}catch(e){m.textContent=e.code==="cancelled"?"Đã huỷ.":"Chưa tải được "+f+": "+(e.message||e.code)}}
function tabAgent(p){const url=location.href.split("#")[0];const prompt=`Bạn là agent của Gen Planner Studio.
Studio: ${url}
Dự án: ${p.id} — "${p.name}"

1. Đọc dự án (ArtifactData get projects/${p.id}), đặt status = "running".
2. Chạy quy trình 12 bước của repo colamacbook-ryan/Gen-Planners: nghiên cứu song song, mọi số vào assumptions có nguồn, viết sections + deck + story (trang toàn cảnh), build, check 0 lỗi.
3. Ghi projects/${p.id}, dossiers/${p.id}, documents/${p.id}; đưa bộ file lên files/${p.id}/.
4. Cập nhật stages sau mỗi bước; kết thúc status = "done".`;
  return `<div class="split"><div class="panel"><div class="label" style="margin-bottom:8px">Giao dự án cho agent</div><div class="copybox" id="ap">${esc(prompt)}</div><div style="margin-top:10px"><button type="button" class="primary" id="cp">Sao chép</button></div></div>
  <div class="panel prose"><h3>Cách hoạt động</h3><p>Bản chạy thử dùng database của trang làm API: agent đăng nhập bằng tài khoản Claude của bạn và ghi vào <code>projects</code>, <code>dossiers</code>, <code>documents</code>.</p><p>Bản chính thức: MCP server, đăng nhập Google, mỗi người một khoá API.</p><p>Trạng thái: <span class="chip c-${esc(p.status)}">${esc(STATUS[p.status]||p.status)}</span> · ${Object.values(p.stages||{}).filter(v=>v==="done").length}/12 bước</p></div></div>`}
const TABS=[["dossier","Hồ sơ"],["finance","Tài chính"],["assumptions","Giả định"],["evidence","Nguồn"],["deck","Deck"],["files","Tải về"],["agent","Agent"]];
function detail(p,d,docs){let body="";switch(S.tab){case"dossier":body=tabDossier(docs);break;case"finance":body=tabFinance(d,docs);break;case"assumptions":body=tabAssumptions(d);break;case"evidence":body=tabEvidence(d);break;case"deck":body=tabDeck(docs);break;case"files":body=tabFiles(p);break;case"agent":body=tabAgent(p);break}
  return `<div class="wrap" style="padding-block:26px 60px"><div class="label">${esc(STATUS[p.status]||p.status)} · ${esc(p.version||"")}</div><h2 style="font:600 30px/1.15 var(--f-display);margin:6px 0 0">${esc(p.name)}</h2>
  <nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("")}</nav>${body}</div>`}

function newForm(){return `<div class="wrap queue"><form id="nf" class="panel"><div class="label">Dự án mới</div><h2 style="font:600 28px/1.15 var(--f-display);margin:0 0 6px">Bắt đầu từ một ý tưởng</h2>
  <label class="label" for="nf-name">Tên dự án</label><input id="nf-name" required maxlength="80" placeholder="Ví dụ: Chuỗi cà phê làm việc cho freelancer">
  <label class="label" for="nf-idea">Mô tả ý tưởng</label><textarea id="nf-idea" required placeholder="Kể như với một người bạn: ý tưởng là gì, bán cho ai, vì sao bạn thấy tiềm năng, nguồn lực đang có…"></textarea>
  <button class="primary" type="submit" id="nf-go">Tạo và gửi cho agent</button><div class="hint" id="nf-msg"></div></form>
  <div class="panel prose"><h3>Agent sẽ làm gì</h3><ol><li>Nghiên cứu song song 7 hướng: thị trường, nguồn hàng, pháp lý, khách hàng, mô hình so sánh, cơ hội chưa ai làm, tín hiệu dài hạn.</li><li>Ghi mọi con số kèm nguồn và trạng thái kiểm chứng.</li><li>Dựng bản đồ cơ hội, chuỗi giá trị, tài chính theo mảng, lộ trình và cửa ải, rủi ro.</li><li>Trả về trang toàn cảnh này cùng bộ Word, PowerPoint, Excel.</li></ol></div></div>`}

/* ---------- shell ---------- */
function render(){
  const sel=$("#psel");sel.innerHTML=S.projects.length?S.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===S.cur?"selected":""}>${esc(p.name)}${p.status!=="done"?" · "+esc(STATUS[p.status]||p.status):""}</option>`).join(""):`<option>${S.db?"Chưa có dự án":"Cần đăng nhập"}</option>`;
  $("#v-canvas").setAttribute("aria-pressed",S.view==="canvas");$("#v-data").setAttribute("aria-pressed",S.view==="data");$("#v-detail").setAttribute("aria-pressed",S.view==="detail");
  const R=$("#root");
  if(S.view==="new"){R.innerHTML=newForm();bindNew();return}
  const p=S.projects.find(x=>x.id===S.cur);
  if(!p){R.innerHTML=`<div class="wrap" style="padding-block:60px"><div class="empty">${S.db?"Chưa có dự án nào. Bấm “+ Dự án mới” để bắt đầu từ một ý tưởng.":"Đăng nhập claude.ai để xem và tạo dự án."}</div></div>`;return}
  R.innerHTML=S.view==="canvas"?consoleView(p,S.dossier):S.view==="data"?dashboard(p,S.dossier):detail(p,S.dossier,S.docs);
  R.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{S.step=b.dataset.step;render();const st=document.querySelector(".stage");if(st&&st.getBoundingClientRect().top<0)st.scrollIntoView()});
  R.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.dgrp=b.dataset.g;render()});
  R.querySelectorAll("[data-tbl]").forEach(b=>b.onclick=()=>{const t=$("#tb-"+b.dataset.tbl);t.classList.toggle("on");b.textContent=t.classList.contains("on")?"Ẩn bảng":"Bảng số"});
  R.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  R.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{S.sec=+b.dataset.sec;render()});
  R.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.flt=b.dataset.f;render()});
  R.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>download(p.id,b.dataset.file));
  const gf=$("#goFiles");if(gf)gf.onclick=()=>{S.view="detail";S.tab="files";render();scrollTo(0,0)};
  const cp=$("#cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText($("#ap").textContent);toast("Đã sao chép")}catch{const r=document.createRange();r.selectNodeContents($("#ap"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Đã chọn sẵn, nhấn Ctrl+C")}};
}
function bindNew(){$("#nf").addEventListener("submit",async e=>{e.preventDefault();const name=$("#nf-name").value.trim(),idea=$("#nf-idea").value.trim();if(!name||!idea)return;
  const id=slugify(name)+"-"+Date.now().toString(36).slice(-4);$("#nf-go").disabled=true;
  try{await S.db.doc("projects/"+id).set({id,name,idea,status:"queued",stages:{},created:new Date().toISOString(),created_by:S.user?await S.user.id():null});toast("Đã tạo dự án, chờ agent");open(id,"detail");S.tab="agent";render()}
  catch(err){$("#nf-msg").textContent="Không lưu được ("+(err.code||"lỗi")+"). Bạn cần quyền chỉnh sửa trang này.";$("#nf-go").disabled=false}})}
function open(id,view){S.cur=id;S.view=view||"canvas";S.sec=0;S.dossier=null;S.docs=null;S.unsub.forEach(u=>u());S.unsub=[];
  S.unsub.push(S.db.doc("dossiers/"+id).onSnapshot(s=>{S.dossier=s.exists?s.data():null;render()},()=>{}));
  S.unsub.push(S.db.doc("documents/"+id).onSnapshot(s=>{S.docs=s.exists?s.data():null;render()},()=>{}));render()}
$("#psel").onchange=e=>{if(S.db&&e.target.value)open(e.target.value,S.view==="new"?"canvas":S.view)};
$("#v-canvas").onclick=()=>{S.view="canvas";render()};
$("#v-detail").onclick=()=>{S.view="detail";render()};
document.addEventListener("keydown",e=>{if(S.view!=="canvas"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const i=STEPS.findIndex(x=>x[0]===(S.step||"context"));if(e.key==="ArrowRight"&&i<STEPS.length-1){S.step=STEPS[i+1][0];render()}if(e.key==="ArrowLeft"&&i>0){S.step=STEPS[i-1][0];render()}});
$("#v-data").onclick=()=>{S.view="data";render()};
{const tip=$("#tip");document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute("data-tip");tip.hidden=false;const x=Math.min(e.clientX+14,innerWidth-270);tip.style.left=x+"px";tip.style.top=(e.clientY+14)+"px"})}
$("#newBtn").onclick=()=>{if(!S.db){toast("Cần đăng nhập để tạo dự án");return}S.view="new";render()};
/* Chế độ REST (Gen Planner SaaS): window.GP = {api:"/api", project:"<id>"} — chỉ đọc một dự án. */
function restClaude(GP){
  const get=u=>fetch(GP.api+u,{credentials:"same-origin"}).then(r=>r.ok?r.json():null);
  const db={collection:()=>({onSnapshot:(f)=>{get(`/projects/${GP.project}/export/project`).then(p=>f({docs:p?[{data:()=>p}]:[]}));return()=>{}}}),
    doc:(path)=>({onSnapshot:(f)=>{const [k,id]=path.split("/");const part=k==="dossiers"?"dossier":"documents";get(`/projects/${id}/export/${part}`).then(x=>f({exists:!!x,data:()=>x}));return()=>{}}})};
  const dl={save:async({filename,data})=>{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement("a");a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}};
  return {use:async n=>n==="db"?db:n==="downloads"?dl:null};
}
(async()=>{
  if(!window.claude?.use&&window.GP){window.claude=restClaude(window.GP);document.getElementById("newBtn").hidden=true}
  const c=window.claude;if(!c?.use){render();return}
  const [db,user,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  S.db=db;S.user=user;S.dl=dl;if(!db){render();return}
  db.collection("projects").onSnapshot(s=>{S.projects=s.docs.map(x=>x.data()).sort((a,b)=>(b.updated||b.created||"").localeCompare(a.updated||a.created||""));
    if(!S.cur&&S.projects.length&&S.view!=="new"){open(S.projects[0].id,"canvas");return}render()},()=>render());
})();
</script>
