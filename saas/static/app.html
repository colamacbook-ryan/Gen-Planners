<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gen Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/gp.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head><body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b id="site">Gen Planner</b><small>Từ ý tưởng tới hồ sơ khai phá</small></div>
    <nav>
      <a href="#home" id="navHome"><span data-ic="home"></span>Bắt đầu <span class="badge" id="obProg"></span></a>
      <button id="newBtn" type="button"><span data-ic="plus"></span>Dự án mới</button>
      <div class="sec">Dự án của tôi</div>
      <input id="pq" class="side-search" type="search" placeholder="Tìm dự án…" aria-label="Tìm dự án" hidden>
      <div id="plist"></div>
      <div class="sec" id="ssec" hidden>Dự án mẫu</div>
      <div id="slist"></div>
      <div class="sec">Tài khoản</div>
      <a href="#settings" id="navSettings"><span data-ic="gear"></span>Cài đặt</a>
      <a href="/admin" id="navAdmin" hidden><span data-ic="shield"></span>Trang quản trị</a>
    </nav>
    <div class="foot"><div id="who"></div><a href="#" onclick="logout();return false">Đăng xuất</a></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="/static/gp.js"></script>
<script>
const S = {me: null, projects: [], samples: [], cur: null, tab: "interview", keys: [], providers: {}, poll: null};
const TABS = [["interview", "Phỏng vấn"], ["brainstorm", "Brainstorm"], ["brief", "Brief"], ["run", "Chạy Plan"], ["dossier", "Hồ sơ"], ["numbers", "Số liệu"]];
const EXAMPLE = {name: "Chuỗi cà phê robot pha chế", idea: "Quán cà phê nhỏ (30–40 m²) nơi tay robot pha chế ngay trước mặt khách — vừa uống vừa xem như một màn trình diễn. Khách đặt món qua app, robot làm 60–80 ly/giờ. Có góc trải nghiệm cho trẻ em lập trình robot đơn giản vào cuối tuần, bán gói sinh nhật. Bắt đầu 1 điểm ở TP.HCM trong trung tâm thương mại, sau 2 năm nhượng quyền. Đội ngũ: tôi là kỹ sư tự động hoá, một bạn làm F&B 8 năm. Vốn tự có khoảng 800 triệu."};
const CAT = {product: "Sản phẩm", customer: "Khách hàng", channel: "Kênh", revenue: "Doanh thu", ops: "Vận hành", team: "Đội ngũ", risk: "Rủi ro", roadmap: "Lộ trình", other: "Khác"};

$$("[data-ic]").forEach(e => e.outerHTML = icon(e.dataset.ic));          // icon SVG chung cho thanh bên
Object.defineProperty(window, "ME", {get: () => S.me, configurable: true});            // topbar() dùng chung đọc người dùng hiện tại
function route() {
  clearInterval(S.poll);
  const h = new URLSearchParams(location.hash.slice(1));
  if (location.hash.startsWith("#settings")) return viewSettings();
  if (location.hash === "#new") return viewNew();
  if (location.hash === "#home" || (!h.get("p") && !S.projects.length)) return viewHome();
  const slug = h.get("p") || S.projects[0].slug, t = h.get("t");
  if (TABS.some(([k]) => k === t)) S.tab = t;                         // chỉ nhận tab hợp lệ — hash là dữ liệu người ngoài gửi được
  openProject(slug);
}
function go(slug, tab) { location.hash = `p=${slug}&t=${tab || S.tab}`; }
window.onhashchange = route;
$("#newBtn").onclick = () => location.hash = "new";
$("#pq").oninput = () => sideList();

function sideList() {
  const cur = S.cur?.slug, q = ($("#pq").value || "").trim().toLowerCase();
  $("#pq").hidden = S.projects.length < 7;                                           // nhiều dự án mới cần ô tìm
  const row = p => `<a href="#p=${esc(p.slug)}&t=${esc(S.tab)}" class="${p.slug === cur ? "on" : ""}">
    <span class="grow">${esc(p.name)}<span class="sub">${STATUS[p.status] || p.status} · ${p.progress.answered}/${p.progress.total} câu · ${p.locked} điểm chốt</span></span></a>`;
  const hit = S.projects.filter(p => !q || p.name.toLowerCase().includes(q)), live = hit.filter(p => !p.archived), arch = hit.filter(p => p.archived);
  $("#plist").innerHTML = (live.map(row).join("") || `<p class="hint" style="padding:0 10px;color:var(--hero-muted)">${q ? "Không có dự án khớp." : "Chưa có dự án."}</p>`)
    + (arch.length ? `<details class="arch" ${q || arch.some(p => p.slug === cur) ? "open" : ""}><summary>Đã lưu trữ (${arch.length})</summary>${arch.map(row).join("")}</details>` : "");
  $("#slist").innerHTML = S.samples.map(p => `<a href="#p=${esc(p.slug)}&t=dossier" class="${p.slug === cur ? "on" : ""}"><span class="grow">${esc(p.name)}<span class="sub">chỉ đọc · hồ sơ hoàn chỉnh</span></span></a>`).join("");
  $("#ssec").hidden = !S.samples.length;
  $("#navSettings").className = location.hash.startsWith("#settings") ? "on" : "";
  $("#navHome").className = location.hash === "#home" || (!cur && !location.hash.startsWith("#new") && !location.hash.startsWith("#settings")) ? "on" : "";
  const ob = S.me.onboarding; $("#obProg").textContent = ob && ob.done < ob.total ? `${ob.done}/${ob.total}` : "";
}

// ---------------------------------------------------------------- bắt đầu (người dùng mới)
const STEP_GO = {sample: () => S.samples[0] && openSample(), key: () => location.hash = "settings", project: () => location.hash = "new",
  interview: () => latest("interview"), locked: () => latest("brainstorm"), plan: () => latest("run"), share: () => latest("dossier")};
function latest(tab) { if (S.projects[0]) go(S.projects[0].slug, tab); else location.hash = "new"; }
function openSample() { const s = S.samples[0]; api("/me/onboarding", {body: {viewed_sample: true}}).catch(() => {}); go(s.slug, "dossier"); }
function viewHome() {
  S.cur = null; sideList();
  const ob = S.me.onboarding, next = ob.steps.find(x => !x.done && !x.optional), sm = S.samples[0], first = S.me.name || S.me.email.split("@")[0];
  $("#main").innerHTML = topbar(`Chào ${esc(first)}`, "Từ ý tưởng tới bộ hồ sơ gọi vốn — làm theo từng bước bên dưới") + `<div class="body">
    <div class="grid g2" style="align-items:start">
      <section class="card"><div class="row"><h2 class="grow" style="margin:0">Bắt đầu trong ${ob.total} bước</h2><span class="hint">${ob.done}/${ob.total}</span></div>
        <div class="meter" style="margin:10px 0 6px"><i style="width:${ob.done / ob.total * 100}%"></i></div>
        <ol class="checklist">${ob.steps.map(x => `<li class="${x.done ? "done" : x === next ? "next" : ""}"><span class="tick" aria-hidden="true">${x.done ? "✓" : ""}</span>
          <span class="grow">${esc(x.title)}</span>${x.done ? "" : x.optional ? `<button type="button" class="sm ghost" data-step="${x.id}">Mở</button>` : `<button type="button" class="sm ${x === next ? "pri" : "ghost"}" data-step="${x.id}">${x === next ? "Làm ngay" : "Mở"}</button>`}</li>`).join("")}</ol>
        <p class="hint" style="margin:8px 0 0">Mỗi bước tự đánh dấu khi bạn làm xong trong ứng dụng.</p></section>
      <div class="grid" style="gap:14px">
        ${sm ? `<section class="card feature"><div class="k">Xem trước kết quả</div><h2 style="margin:6px 0">${esc(sm.name)}</h2>
          <p class="hint">Bộ hồ sơ hoàn chỉnh do agent dựng: console câu chuyện 6 bước, dashboard số liệu, nguồn có URL, file Word · PowerPoint · Excel. Bạn sẽ nhận được bộ hồ sơ như thế này cho ý tưởng của mình.</p>
          <button type="button" class="pri" id="openSample">Xem hồ sơ mẫu →</button></section>` : ""}
        ${S.me.role === "owner" && !S.me.core_ready ? `<section class="card"><div class="k">Thiết lập hệ thống · chỉ owner thấy</div><h2 style="margin:6px 0">Bật core agent</h2>
          <p class="hint">Người dùng chưa chạy Plan bằng tài khoản hệ thống được cho tới khi có một core agent đăng nhập sẵn sàng. Họ vẫn dùng được key riêng, agent ngoài${S.me.demo_allowed ? " và demo" : ""}.</p>
          <a href="/admin#agents"><button type="button">Mở trang Core agent →</button></a></section>` : ""}
        <section class="card"><div class="k">Ý tưởng của bạn</div><h2 style="margin:6px 0">Tạo dự án mới</h2>
          <p class="hint">Chỉ cần tên và vài câu mô tả. Trợ lý sẽ phỏng vấn để hiểu sâu hơn — không cần chuẩn bị gì thêm.</p>
          <button type="button" id="homeNew">Dự án mới</button></section>
        ${S.me.has_keys || S.me.ai_live ? "" : `<section class="card"><div class="k">Trợ lý AI</div><p class="hint" style="margin:6px 0 10px">Trợ lý phỏng vấn, brainstorm và Chạy Plan bằng API key AI của bạn (DeepSeek, Anthropic, OpenAI, Gemini hoặc OpenRouter). Key được mã hoá và không bao giờ hiện lại.</p><a href="#settings"><button type="button">Thêm API key</button></a></section>`}
      </div></div></div>`;
  $$("[data-step]").forEach(b => b.onclick = () => STEP_GO[b.dataset.step]());
  $("#openSample") && ($("#openSample").onclick = openSample);
  $("#homeNew").onclick = () => location.hash = "new";
}
function keyBanner() {
  if (S.me.ai_live) return `<div class="banner"><b>Bản demo:</b> trợ lý đang chạy bằng Claude trong tài khoản claude.ai của bạn — không cần API key. Trên bản máy chủ, mỗi người dùng thêm API key riêng ở Cài đặt.</div>`;
  if (S.me.has_keys) return "";
  return `<div class="banner"><b>Chưa có API key.</b> Trợ lý AI chạy bằng key của chính bạn (DeepSeek, Anthropic, OpenAI, Gemini hoặc OpenRouter).
    ${S.me.demo_allowed ? "Hiện đang ở <b>chế độ demo</b> — câu hỏi theo kịch bản, không có AI phản biện." : ""} <a href="#settings">Thêm key →</a></div>`;
}

// ---------------------------------------------------------------- new project
function viewNew() {
  S.cur = null; sideList();
  $("#main").innerHTML = topbar("Dự án mới", "Tên và vài câu mô tả là đủ — trợ lý sẽ phỏng vấn để hiểu sâu hơn") + `<div class="body"><div class="grid g2">
    <form class="card" id="nf">${keyBanner()}
      <label for="nn">Tên dự án</label><input id="nn" required maxlength="120" placeholder="Ví dụ: Hệ sinh thái AI Robot Pet">
      <div class="row" style="margin:10px 0 4px"><label for="ni" class="grow" style="margin:0">Mô tả ý tưởng — viết tự nhiên, càng chi tiết càng tốt</label><button type="button" class="sm ghost" id="fillEx">Điền ví dụ</button></div>
      <textarea id="ni" rows="12" required placeholder="Sản phẩm là gì, cho ai, kiếm tiền thế nào, các mảng xung quanh, nguồn lực đang có…"></textarea>
      <div class="row hint" style="justify-content:space-between"><span id="niHint">Gợi ý: sản phẩm · khách hàng · cách kiếm tiền · nguồn lực</span><span id="niCount">0 ký tự</span></div>
      <label for="nc">Thị trường mục tiêu</label><input id="nc" list="mkts2" value="${esc(S.me.prefs?.country || "Việt Nam")}"><datalist id="mkts2">${MARKETS.map(x => `<option value="${x}">`).join("")}</datalist>
      <p class="err" id="nmsg"></p><button class="pri">Tạo dự án & bắt đầu phỏng vấn</button>
      <p class="hint">Hạn mức: ${S.me.quota.projects_limit == null ? "không giới hạn" : `${S.me.quota.projects}/${S.me.quota.projects_limit} dự án`}.</p></form>
    <div class="card"><div class="k">Quy trình chuẩn</div>
      <ol style="padding-left:1.1em;margin:8px 0 0">
        <li><b>Phỏng vấn founder</b> — trợ lý hỏi từng câu theo 10 chủ đề để giữ đúng ý tưởng gốc của bạn.</li>
        <li><b>Brainstorm</b> — thảo luận tự do; AI đề xuất điểm cần chốt, bạn <i>Chốt</i> hoặc <i>Loại</i>.</li>
        <li><b>Brief</b> — tự biên dịch từ câu trả lời + điểm đã chốt; là neo bắt buộc cho agent.</li>
        <li><b>Chạy Plan</b> — core agent nghiên cứu R1–R9, dựng số liệu một nguồn, kiểm tra chất lượng.</li>
        <li><b>Hồ sơ</b> — console câu chuyện, dashboard, tải Word/PowerPoint/Excel.</li></ol></div></div></div>`;
  const cover = () => { const t = $("#ni").value, has = [["sản phẩm", /sản phẩm|dịch vụ|bán|quán|app|máy/i], ["khách hàng", /khách|người dùng|cho ai|gia đình|trẻ|doanh nghiệp/i],
      ["cách kiếm tiền", /giá|doanh thu|bán|phí|thu|lợi nhuận/i], ["nguồn lực", /vốn|đội|kinh nghiệm|nhà xưởng|mặt bằng|team/i]];
    $("#niCount").textContent = t.length + " ký tự";
    const miss = has.filter(([, re]) => !re.test(t)).map(([n]) => n);
    $("#niHint").textContent = t.length < 20 ? "Gợi ý: sản phẩm · khách hàng · cách kiếm tiền · nguồn lực" : miss.length ? "Có thể thêm: " + miss.join(" · ") : "✓ Đủ ý để bắt đầu phỏng vấn"; };
  $("#ni").oninput = cover;
  $("#fillEx").onclick = () => { $("#nn").value ||= EXAMPLE.name; $("#ni").value = EXAMPLE.idea; cover(); };
  $("#nf").onsubmit = async e => { e.preventDefault(); const btn = $("#nf button.pri, #nf button:not([type])");
    if (btn?.disabled) return; if (btn) btn.disabled = true;                        // bấm đúp không tạo 2 dự án
    try { const p = await api("/projects", {body: {name: $("#nn").value, idea: $("#ni").value, country: $("#nc").value}});
      await loadProjects(); S.tab = "interview"; go(p.slug, "interview"); } catch (x) { $("#nmsg").textContent = x.message; if (btn) btn.disabled = false; } };
}

// ---------------------------------------------------------------- project shell
async function openProject(slug) {
  try { S.cur = await api("/projects/" + slug); } catch (x) { toast(x.message); return viewHome(); }
  if (S.cur.is_sample && S.tab === "interview") S.tab = "dossier";
  sideList(); renderProject();
}
function nextStep(p) {
  if (!p.mine || p.is_sample) return p.is_sample ? ["Đây là dự án mẫu (chỉ đọc) — xem tab Hồ sơ và Số liệu để biết bộ hồ sơ cuối cùng trông thế nào.", null, null] : ["Bạn đang xem dự án của người khác (chỉ đọc).", null, null];
  const running = p.jobs.find(j => ["queued", "starting", "running", "waiting"].includes(j.status));
  const miss = p.progress.required_missing.length;
  if (running) { const pr = running.progress ? JSON.parse(running.progress) : null; return [`Đang chạy ${running.kind === "plan" ? "Plan" : "cập nhật"}${pr ? ` — xong ${pr.done}/${pr.total} stage` : ""}. Bạn có thể đóng trang, tiến độ vẫn chạy.`, "run", "Xem tiến trình"]; }
  if (miss) return [`Bước tiếp: trả lời ${miss} câu phỏng vấn bắt buộc còn thiếu.`, "interview", "Tiếp tục phỏng vấn"];
  if (!p.locked) return ["Bước tiếp: chốt ít nhất một điểm quan trọng ở Brainstorm — điểm đã chốt là neo cho agent.", "brainstorm", "Mở Brainstorm"];
  if (!p.exported) return ["Đủ thông tin. Bước tiếp: chạy Plan để agent nghiên cứu và dựng hồ sơ.", "run", "Chạy Plan"];
  if (!p.shares.length) return ["Hồ sơ đã xong. Bước tiếp: gửi link chỉ đọc cho nhà đầu tư, hoặc thử đổi giả định ở tab Số liệu.", "dossier", "Chia sẻ hồ sơ"];
  return null;
}
// Mỗi lần vẽ lại một tab tăng S.view; hàm async kiểm `alive(v)` sau mỗi await để không ghi vào tab người dùng đã rời đi.
const alive = v => v === S.view && $("#tab");
function renderProject() {
  S.view = (S.view || 0) + 1;
  const p = S.cur, pr = p.progress, pct = Math.round(pr.answered / pr.total * 100);
  $("#main").innerHTML = topbar(esc(p.name) + (p.archived ? " " + pill("archived") : ""),
    `${p.is_sample ? "Dự án mẫu · chỉ đọc" : p.mine ? `Thị trường ${esc(p.country || "—")} · cập nhật ${when(p.updated)}` : "Dự án của người khác · chỉ xem"}`,
    `${pill(p.status)}<div class="hide-sm" style="width:180px"><div class="hint">Phỏng vấn ${pr.answered}/${pr.total} · ${p.locked} điểm chốt</div><div class="meter"><i style="width:${pct}%"></i></div></div>
    <button type="button" class="sm ghost" id="pact" aria-haspopup="menu" aria-label="Thao tác dự án">${icon("more")} Thao tác</button>`,
    `<div class="tabs" role="tablist">${TABS.map(([k, l], i) => `<button type="button" role="tab" aria-selected="${S.tab === k}" data-t="${k}" class="${S.tab === k ? "on" : ""}"><span class="n">${i + 1}</span>${l}</button>`).join("")}</div>`) +
    `<div class="body">${(n => n ? `<div class="banner info next"><span class="grow">${n[0]}</span>${n[1] && n[1] !== S.tab ? `<button type="button" class="sm pri" data-next="${n[1]}">${n[2]} →</button>` : ""}</div>` : "")(nextStep(p))}<div id="tab">${loading()}</div></div>`;
  $$(".tabs button").forEach(b => b.onclick = () => go(p.slug, b.dataset.t));
  $("#pact").onclick = e => menu(e.currentTarget, projectActions(p));
  $("[data-next]") && ($("[data-next]").onclick = e => go(p.slug, e.target.dataset.next));
  ({interview: tabInterview, brainstorm: tabBrainstorm, brief: tabBrief, run: tabRun, dossier: tabDossier, numbers: tabNumbers}[S.tab] || tabInterview)();
}
function projectActions(p) {
  const dup = async () => { try { const n = await api(`/projects/${p.slug}/duplicate`, {method: "POST"}); await loadProjects(); toast("Đã nhân bản — đang dựng lại hồ sơ cho bản sao"); go(n.slug, p.is_sample ? "numbers" : S.tab); } catch (x) { toast(x.message); } };
  if (!p.mine) return p.is_sample ? [["Nhân bản để chỉnh thử", dup]] : [["Dự án của người khác — chỉ xem", () => {}]];
  return [
    ["Đổi tên", async () => { const n = await askText("Tên dự án", p.name); if (!n) return; await api("/projects/" + p.slug, {method: "PATCH", body: {name: n}}); await refresh(); renderProject(); toast("Đã đổi tên"); }],
    ["Sửa ý tưởng & thị trường", async () => { const v = await dialog({title: "Ý tưởng & thị trường", body: "Đổi ý tưởng gốc sẽ áp dụng cho lần Chạy Plan tiếp theo (brief tự tổng hợp lại).",
        fields: [{label: "Ý tưởng", value: p.idea, multiline: true}, {label: "Thị trường", value: p.country}], ok: "Lưu"}); if (!v) return;
      try { await api("/projects/" + p.slug, {method: "PATCH", body: {idea: v[0], country: v[1]}}); await refresh(); renderProject(); toast("Đã lưu"); } catch (x) { toast(x.message); } }],
    ["Nhân bản dự án", dup],
    [p.archived ? "Bỏ lưu trữ" : "Lưu trữ (ẩn khỏi danh sách chính)", async () => { await api("/projects/" + p.slug, {method: "PATCH", body: {archived: !p.archived}}); await refresh(); renderProject(); toast(p.archived ? "Đã bỏ lưu trữ" : "Đã lưu trữ"); }],
    null,
    ["Xoá dự án…", async () => { if (!await ask(`Xoá vĩnh viễn "${p.name}"? Mất cả hồ sơ, lịch sử phiên bản và link chia sẻ.`, "Xoá vĩnh viễn")) return;
      await api("/projects/" + p.slug, {method: "DELETE"}); await loadProjects(); toast("Đã xoá dự án"); location.hash = "home"; }, true]];
}
async function refresh() { S.cur = await api("/projects/" + S.cur.slug); await loadProjects(); S.me = await api("/me"); sideList(); }

// ---------------------------------------------------------------- chat (shared)
async function chatBox(room, el, sideHtml, after) {
  const v = S.view, msgs = await api(`/projects/${S.cur.slug}/messages?room=${room}`);
  if (!alive(v)) return;
  el.innerHTML = `${keyBanner()}<div class="chatwrap"><div class="chat"><div class="msgs" id="msgs">${msgs.map(bubble).join("") ||

    <div class="card kpi"><div class="k">Năm hoà vốn</div><b>${k.breakeven || "chưa"}</b>${before && before.breakeven !== k.breakeven ? `<span class="delta">trước: ${before.breakeven || "chưa"}</span>` : ""}</div>
    <div class="card kpi"><div class="k">Độ tin cậy số liệu</div><b>${bs.verified || 0}<small> / ${(bs.verified || 0) + (bs.estimate || 0) + (bs.placeholder || 0)}</small></b><span>đã kiểm chứng · ${bs.estimate || 0} ước tính · ${bs.placeholder || 0} chưa có</span></div></div>`;

      Gửi email cho tôi khi một lượt Chạy Plan xong hoặc bị lỗi</label>${S.me.mail ? "" : '<p class="hint" style="margin:6px 0 0">Hệ thống chưa bật gửi email — chủ hệ thống cấu hình ở Cài đặt hệ thống → Email.</p>'}</section>
    <section class="card"><h2>Mặc định cho dự án mới</h2><form id="mf"><div class="grid g2" style="gap:0 14px">
      <div><label for="pc">Thị trường mặc định</label><input id="pc" list="mkts" value="${esc(p.country)}"><datalist id="mkts">${MARKETS.map(x => `<option value="${x}">`).join("")}</datalist>
      <div class="hint">Agent nghiên cứu số liệu, luật và đối thủ theo thị trường này. Đổi được riêng cho từng dự án.</div></div></div>
      <div class="form-actions"><button class="pri">Lưu</button></div></form></section>`)) return;
  $$("input[name=th]").forEach(r => r.onchange = async () => { S.me = await api("/me", {method: "PATCH", body: {prefs: {theme: r.value}}}); applyTheme(r.value); setPrefs(S.view); toast("Đã đổi giao diện"); });
  $("#ntf").onchange = async e => { S.me = await api("/me", {method: "PATCH", body: {prefs: {notify_job: e.target.checked}}}); toast(e.target.checked ? "Sẽ gửi email khi Plan xong" : "Đã tắt email thông báo"); };
  $("#mf").onsubmit = async e => { e.preventDefault(); S.me = await api("/me", {method: "PATCH", body: {prefs: {country: $("#pc").value}}}); toast("Đã lưu thị trường mặc định"); };
}

async function setKeys(v) {
  [S.keys, S.providers] = await Promise.all([api("/keys"), api("/providers")]);
  if (!sbody(v, `<section class="card"><h2>API key của tôi</h2><p class="hint">Trợ lý AI (phỏng vấn, brainstorm) chạy bằng key mặc định của bạn. Key Anthropic hoặc Gemini còn dùng được để <b>Chạy Plan</b> bằng tài khoản của bạn. Key được mã hoá, không bao giờ hiển thị lại.</p>
    <div class="scroll-x"><table class="t"><thead><tr><th>Nhà cung cấp</th><th>Key</th><th>Model</th><th>Kiểm tra</th><th></th></tr></thead><tbody>${S.keys.map(k => `<tr data-k="${k.id}">
      <td>${esc(k.label)}${k.is_default ? ' <span class="pill core">mặc định</span>' : ""}<div class="hint">${k.plan_engine ? "chat + chạy Plan" : "chỉ chat"}</div></td><td class="mono">${esc(k.key_hint)}</td>
      <td><input class="km" aria-label="Model của key" value="${esc(k.model)}" list="kml${k.id}" style="min-width:170px" title="Bấm để chọn trong danh sách model key này dùng được"><datalist id="kml${k.id}"></datalist></td><td>${k.last_test ? (k.last_test_ok ? pill("ok") : pill("error")) : '<span class="hint">—</span>'}</td>
      <td class="actions"><button class="sm" data-a="test" type="button">Thử</button>${k.is_default ? "" : '<button class="sm ghost" data-a="def" type="button">Đặt mặc định</button>'}<button class="sm ghost danger" data-a="del" type="button">Xoá</button></td></tr>`).join("") || emptyRow(5, "Chưa có key — thêm key bên dưới để có trợ lý AI thật.")}</tbody></table></div></section>
    <section class="card"><h2>Thêm key</h2><form id="kf"><div class="grid g2" style="gap:0 12px">
      <div><label for="kp">Nhà cung cấp</label><select id="kp">${Object.entries(S.providers).map(([k, p]) => `<option value="${k}">${esc(p.label)}</option>`).join("")}</select></div>
      <div><label for="kmo">Model</label><input id="kmo" list="kml" required><datalist id="kml"></datalist></div></div>
      <label for="kk">API key</label><input id="kk" type="password" required autocomplete="off" placeholder="dán key vào đây">
      <p class="err" id="kmsg"></p><button class="pri">Lưu key</button></form></section>`)) return;
  const fill = () => { const m = S.providers[$("#kp").value].models; $("#kml").innerHTML = m.map(x => `<option value="${x}">`).join(""); $("#kmo").value = m[0] || ""; $("#kmo").placeholder = m.length ? "" : "nhập tên model, ví dụ gpt-…"; };
  $("#kp").onchange = fill; fill();
  $("#kf").onsubmit = async e => { e.preventDefault(); const btn = e.submitter; btn.disabled = true; btn.textContent = "Đang kiểm tra key…";
    try { const k = await api("/keys", {body: {provider: $("#kp").value, model: $("#kmo").value, key: $("#kk").value}});
      const t = await api(`/keys/${k.id}/test`, {method: "POST"}); S.me = await api("/me");
      toast(t.ok ? "Đã lưu key và gọi thử thành công" + (t.message.includes("chuyển sang") ? t.message.slice(t.message.indexOf(" · ")) : "") : "Đã lưu key nhưng gọi thử lỗi: " + t.message); viewSettings(); }
    catch (x) { $("#kmsg").textContent = x.message; btn.disabled = false; btn.textContent = "Lưu key"; } };
  $$("tr[data-k]").forEach(tr => { const id = tr.dataset.k, km = tr.querySelector(".km");
    km.onchange = async e => { await api("/keys/" + id, {method: "PATCH", body: {model: e.target.value}}); toast("Đã đổi model"); };
    km.onfocus = async () => { if (km.dataset.loaded) return; km.dataset.loaded = 1;
      try { const r = await api(`/keys/${id}/models`); $("#kml" + id).innerHTML = r.models.map(m => `<option value="${esc(m)}">`).join(""); toast(`${r.models.length} model dùng được với key này`); }
      catch (x) { toast(x.message); } };
    tr.querySelectorAll("button").forEach(b => b.onclick = async () => { const a = b.dataset.a;
      if (a === "test") { b.disabled = true; b.textContent = "…"; const r = await api(`/keys/${id}/test`, {method: "POST"}); toast(r.ok ? "Key hoạt động — " + r.message : r.message); }
      if (a === "def") await api("/keys/" + id, {method: "PATCH", body: {is_default: true}});
      if (a === "del") { if (!await ask("Xoá key này?", "Xoá")) return; await api("/keys/" + id, {method: "DELETE"}); }
      S.me = await api("/me"); viewSettings(); }); });
}

function setTokens(v) {
  if (!sbody(v, `<section class="card"><h2>API token cho agent ngoài</h2><p class="hint">Cho Claude Code, Antigravity hoặc agent của bạn làm core agent: agent đọc/ghi bộ số liệu của dự án qua API bằng token này.
      Token chỉ dùng được các lệnh của agent (không vào được cài đặt, key hay quản trị) — vẫn nên thu hồi khi không dùng.</p>
    <div class="scroll-x"><table class="t"><thead><tr><th>Tên</th><th>Lần dùng gần nhất</th><th></th></tr></thead><tbody id="tokRows"><tr><td colspan="3"><span class="spinner"></span></td></tr></tbody></table></div>
    <form class="row" id="tokF" style="margin-top:12px"><input id="tokN" aria-label="Tên token" class="grow" placeholder="Tên token, ví dụ: Claude Code trên MacBook"><button class="pri">Tạo token</button></form><div id="tokOut"></div></section>`)) return;
  const drawTok = async () => { const ts = await api("/tokens"); if (!$("#tokRows")) return;
    $("#tokRows").innerHTML = ts.map(t => `<tr><td><b>${esc(t.name)}</b><div class="hint mono">${esc(t.prefix)}…</div></td><td class="hint">${t.last_used ? when(t.last_used) : "chưa dùng"}</td><td class="actions"><button type="button" class="sm ghost danger" data-tok="${t.id}">Thu hồi</button></td></tr>`).join("") || emptyRow(3, "Chưa có token.");
    $$("[data-tok]").forEach(b => b.onclick = async () => { if (!await ask("Thu hồi token này? Agent đang dùng nó sẽ mất quyền ngay.", "Thu hồi")) return; await api("/tokens/" + b.dataset.tok, {method: "DELETE"}); toast("Đã thu hồi token"); drawTok(); }); };
  drawTok();
  $("#tokF").onsubmit = async e => { e.preventDefault(); const t = await api("/tokens", {body: {name: $("#tokN").value}}); e.target.reset();
    $("#tokOut").innerHTML = `<div class="next" style="margin-top:10px"><span class="grow">Token mới (chỉ hiện một lần): <code>${esc(t.token)}</code></span><button type="button" class="sm" id="tokC">Sao chép</button></div>`;
    $("#tokC").onclick = () => copy(t.token); drawTok(); };
}

async function setUsage(v) {
  const u = await api("/me/usage"), q = u.quota, BILLN = {...BILL, user_key: "key của bạn"};
  const lim = (n, l, unit) => l == null ? `<b>${n}</b> <span class="hint">${unit} · không giới hạn</span>` : `<b>${n}</b><small> / ${l}</small> <span class="hint">${unit}</span><div class="meter" style="margin-top:6px"><i style="width:${Math.min(100, n / l * 100)}%"></i></div>`;
  sbody(v, `<div class="grid g2"><section class="card kpi"><div class="k">Dự án</div>${lim(q.projects, q.projects_limit, "dự án")}</section>
      <section class="card kpi"><div class="k">Chạy Plan bằng tài khoản hệ thống · tháng này</div>${lim(q.owner_jobs_month, q.owner_jobs_limit, "lần")}</section></div>
    <section class="card"><h2>Theo tháng</h2><p class="hint">Token là của trợ lý AI và các lần chạy bằng key của bạn (bạn trả cho nhà cung cấp). Lần chạy lỗi do phía hệ thống không tính.</p>
    <div class="scroll-x"><table class="t"><thead><tr><th>Tháng</th><th class="num">Token vào</th><th class="num">Token ra</th><th class="num">Chi phí ước tính</th><th>Lần chạy Plan</th></tr></thead><tbody>
    ${u.months.map(m => `<tr><td>${m.month.slice(5)}/${m.month.slice(0, 4)}</td><td class="num">${fmtInt(m.input_tokens)}</td><td class="num">${fmtInt(m.output_tokens)}</td>
      <td class="num">${m.cost_usd ? "$" + m.cost_usd.toLocaleString("vi-VN", {maximumFractionDigits: 2}) : "—"}</td>
      <td>${Object.entries(m.runs).map(([b, n]) => `${n} · ${BILLN[b] || b}`).join("<br>") || '<span class="hint">—</span>'}</td></tr>`).join("") || emptyRow(5, "Chưa có hoạt động nào.")}</tbody></table></div></section>`);
}

function setData(v) {
  const owner = S.me.role === "owner";
  if (!sbody(v, `<section class="card"><h2>Tải toàn bộ dữ liệu</h2><p class="hint">Một file .zip: thông tin tài khoản, mọi dự án (câu trả lời phỏng vấn, điểm chốt, hội thoại, bộ số liệu SSOT, hồ sơ Word/PowerPoint/Excel đã dựng). Không chứa API key.</p>
      <a href="/api/me/export"><button type="button">${icon("download")}Tải dữ liệu (.zip)</button></a></section>
    <section class="card danger-zone"><h2>Xoá tài khoản</h2><p class="hint">Xoá vĩnh viễn tài khoản, mọi dự án, key, token và link chia sẻ. Không khôi phục được — nên tải dữ liệu trước.</p>
      ${owner ? '<div class="banner">Bạn là owner hệ thống — trao quyền owner cho người khác ở Quản trị → Người dùng trước khi xoá tài khoản.</div>' : `<form id="df">
      <div class="grid g2" style="gap:0 14px"><div><label for="dce">Gõ email của bạn để xác nhận</label><input id="dce" autocomplete="off" placeholder="${esc(S.me.email)}"></div>
      ${S.me.has_password ? '<div><label for="dcp">Mật khẩu</label><input id="dcp" type="password" autocomplete="current-password"></div>' : ""}</div>
      <p class="err" id="dmsg"></p><button class="danger">Xoá vĩnh viễn tài khoản</button></form>`}</section>`)) return;
  $("#df") && ($("#df").onsubmit = async e => { e.preventDefault(); $("#dmsg").textContent = "";
    if (!await ask("Xoá vĩnh viễn tài khoản và mọi dự án? Không thể hoàn tác.", "Xoá vĩnh viễn")) return;
    try { await api("/me/delete", {body: {confirm: $("#dce").value, password: $("#dcp")?.value || ""}}); location.href = "/login"; } catch (x) { $("#dmsg").textContent = x.message; } });
}

async function loadProjects() { [S.projects, S.samples] = await Promise.all([api("/projects"), api("/samples")]); sideList(); }
(async () => {
  S.me = await api("/me"); applyTheme(S.me.prefs?.theme); $("#site").textContent = S.me.site_name; document.title = S.me.site_name;
  $("#who").textContent = S.me.email; $("#navAdmin").hidden = !["owner", "admin"].includes(S.me.role);
  await loadProjects(); route();
})();
</script></body></html>
