<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gen Planner — Quản trị</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/gp.css">
<style>
.term{background:var(--term-bg);color:var(--term-fg);border-radius:10px;padding:12px;font:12px/1.45 var(--f-mono);white-space:pre-wrap;height:320px;overflow-y:auto;margin:0}
.prof{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)} .prof.act{border-color:var(--core);box-shadow:0 0 0 1px var(--core)}
.prof h3{margin:0;font-size:15px} .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12.5px;margin:10px 0} .kv span:nth-child(odd){color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--c1);border-radius:3px 3px 0 0;min-height:2px;position:relative} .bars i:hover{filter:brightness(1.2)}
.bars .stack{flex:1;display:flex;flex-direction:column-reverse;height:100%;gap:1px} .bars .stack i{flex:none;min-height:0;border-radius:2px}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.urls a{display:block;word-break:break-all;margin:4px 0;font-family:var(--f-mono);font-size:12px}
</style></head><body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b id="site">Gen Planner</b><small>Trang quản trị SaaS</small></div>
    <nav id="nav"></nav>
    <div class="foot"><div id="who"></div><a href="/app">← Về ứng dụng</a> · <a href="#" onclick="logout();return false">Đăng xuất</a></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="/static/gp.js"></script>
<script>
const A = {me: null, poll: null};
const PAGES = [["overview", "Tổng quan", false, "gauge"], ["users", "Người dùng", false, "users"], ["projects", "Dự án", false, "folder"], ["jobs", "Lượt chạy", false, "list"],
  ["agents", "Core agent", true, "cpu"], ["usage", "Mức dùng AI", false, "chart"], ["settings", "Cài đặt hệ thống", true, "sliders"], ["audit", "Nhật ký thao tác", false, "log"]];
const page = () => location.hash.slice(1) || "overview";
window.onhashchange = render;
function nav() { $("#nav").innerHTML = PAGES.filter(p => !p[2] || A.me.role === "owner").map(([k, l, , ic]) => `<a href="#${k}" class="${page() === k ? "on" : ""}">${icon(ic)}${l}</a>`).join(""); }
Object.defineProperty(window, "ME", {get: () => A.me, configurable: true});
async function render() { clearInterval(A.poll); closeOverlays(); nav(); const k = page(), f = {overview, users, projects, jobs, agents, usage, settings, audit}[k] || overview;
  const t = setTimeout(() => { $("#main").innerHTML = topbar(PAGES.find(p => p[0] === k)?.[1] || "") + `<div class="body">${loading()}</div>`; }, 150);   // chỉ hiện khi tải lâu
  try { await f(); } catch (x) { $("#main").innerHTML = topbar(PAGES.find(p => p[0] === k)?.[1] || "Quản trị") + `<div class="body">${loadError("Không tải được trang: " + x.message, "render()")}</div>`; }
  finally { clearTimeout(t); } }
const tok = fmtCompact;

// ---------------------------------------------------------------- overview
const dur = s => s == null ? "—" : s < 90 ? Math.round(s) + " giây" : s < 5400 ? Math.round(s / 60) + " phút" : (s / 3600).toLocaleString("vi-VN", {maximumFractionDigits: 1}) + " giờ";
const bytes = n => n >= 1e9 ? (n / 1e9).toLocaleString("vi-VN", {maximumFractionDigits: 1}) + " GB" : n >= 1e6 ? Math.round(n / 1e6) + " MB" : Math.round(n / 1e3) + " KB";
const pct = (x, d = 0) => x == null ? "—" : (x * 100).toLocaleString("vi-VN", {maximumFractionDigits: d}) + "%";
async function overview() {
  A.days = A.days || 30;
  const [o, m] = await Promise.all([api("/admin/overview"), api("/admin/metrics?days=" + A.days)]), ag = o.active_agent, J = m.jobs, H = m.health, st = m.storage, owner = A.me.role === "owner";
  const alerts = [
    !ag && owner && ["bad", 'Chưa có core agent — người dùng chưa chạy được Plan bằng tài khoản hệ thống. <a href="#agents">Cấu hình agent →</a>'],
    !H.sandbox && ["warn", `Agent chưa được cô lập: ${esc(H.sandbox_hint)}`],
    H.maintenance && ["warn", 'Đang bật chế độ bảo trì — người dùng chỉ xem được. <a href="#settings">Tắt ở Cài đặt →</a>'],
    st.disk_free / st.disk_total < .1 && ["bad", `Ổ đĩa sắp đầy: còn ${bytes(st.disk_free)} (${pct(st.disk_free / st.disk_total)}).`],
    H.oldest_queued_s > 600 && ["warn", `Có job chờ ${dur(H.oldest_queued_s)} — tăng "Số job song song" hoặc kiểm tra core agent.`],
    J.success_rate != null && J.success_rate < .7 && J.done + J.failed >= 5 && ["warn", `Tỉ lệ job thành công thấp (${pct(J.success_rate)}) — xem "Lý do lỗi hay gặp".`]].filter(Boolean);
  const ser = m.series, maxJ = Math.max(1, ...ser.map(d => (d.done || 0) + (d.failed || 0))), maxT = Math.max(1, ...ser.map(d => d.tokens || 0));
  const kpi = (l, v, s) => `<div class="card kpi"><div class="k">${l}</div><b>${v}</b><span>${s}</span></div>`;
  $("#main").innerHTML = topbar("Tổng quan", `Chỉ số ${A.days} ngày gần nhất`, `<div class="seg" role="radiogroup" aria-label="Khoảng thời gian">${[7, 30, 90].map(d => `<label class="${A.days === d ? "on" : ""}"><input type="radio" name="rng" value="${d}" ${A.days === d ? "checked" : ""}>${d} ngày</label>`).join("")}</div>
    <button type="button" class="sm" id="csv">${icon("download")}Xuất CSV</button>`) + `<div class="body">
  ${alerts.map(([lv, t]) => `<div class="banner ${lv}">${t}</div>`).join("")}
  <div class="grid kgrid">
    ${kpi("Người dùng", fmtInt(m.users.total), `+${m.users.new} mới · WAU ${m.users.wau} / MAU ${m.users.mau}${m.users.stickiness != null ? ` · độ dính ${pct(m.users.stickiness)}` : ""}`)}
    ${kpi("Dự án", fmtInt(m.projects.total), `+${m.projects.new} mới · ${m.projects.with_dossier} có hồ sơ · ${m.projects.shares} link chia sẻ, ${fmtInt(m.projects.share_views)} lượt xem`)}
    ${kpi("Job thành công", pct(J.success_rate), `${J.done} xong · ${J.failed} lỗi (${J.system_failed} do hệ thống) · ${J.cancelled} huỷ`)}
    ${kpi("Thời gian chạy Plan", dur(J.duration_p50), `p90 ${dur(J.duration_p90)} · chờ hàng đợi ${dur(J.wait_p50)}`)}
    ${kpi("Token tài khoản hệ thống", tok(m.tokens.owner), `${m.tokens.owner_cost_usd ? "≈ $" + m.tokens.owner_cost_usd.toLocaleString("vi-VN") + " · " : ""}người dùng tự trả ${tok(m.tokens.users)} token`)}
    ${kpi("Hàng đợi · đang chạy / chờ", `${H.running} / ${H.queue}`, H.oldest_queued_s ? `job chờ lâu nhất ${dur(H.oldest_queued_s)}` : "không có job chờ")}
    ${kpi("Lời mời đang mở", fmtInt(o.invites_open), `<a href="#users">Quản lý người dùng & lời mời →</a>`)}
    ${kpi("Ổ đĩa còn trống", bytes(st.disk_free), `${pct(st.disk_free / st.disk_total)} của ${bytes(st.disk_total)}`)}</div>
  <div class="grid g2" style="margin-top:14px">
    <section class="card"><div class="row"><div class="k grow">Job Plan theo ngày</div><span class="legend"><i style="background:var(--ok)"></i>xong <i style="background:var(--bad)"></i>lỗi</span></div>
      ${ser.some(d => d.done || d.failed) ? `<div class="bars" role="img" aria-label="Job Plan theo ngày">${ser.map(d => `<span class="stack" title="${d.d}: ${d.done || 0} xong · ${d.failed || 0} lỗi"><i style="height:${(d.failed || 0) / maxJ * 100}%;background:var(--bad)"></i><i style="height:${(d.done || 0) / maxJ * 100}%;background:var(--ok)"></i></span>`).join("")}</div>
      <div class="axis"><span>${ser[0].d}</span><span>${ser.at(-1).d}</span></div>` : '<div class="empty">Chưa có job trong khoảng này.</div>'}</section>
    <section class="card"><div class="k">Token theo ngày</div>${ser.some(d => d.tokens) ? `<div class="bars">${ser.map(d => `<i style="height:${(d.tokens || 0) / maxT * 100}%" title="${d.d}: ${fmtInt(d.tokens || 0)} token${d.signups ? ` · ${d.signups} đăng ký` : ""}"></i>`).join("")}</div>
      <div class="axis"><span>${ser[0].d}</span><span>${ser.at(-1).d}</span></div>` : '<div class="empty">Chưa có lượt dùng AI trong khoảng này.</div>'}</section></div>
  <div class="grid g2" style="margin-top:14px">
    <section class="card"><div class="k">Phễu kích hoạt người dùng</div>${funnelView(o.funnel)}</section>
    <section class="card"><div class="k">Lý do lỗi hay gặp</div>${J.reasons.length ? `<table class="t" style="margin-top:8px"><tbody>${J.reasons.map(([r, n]) => `<tr><td>${esc(r)}</td><td class="num">${n}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Không có job lỗi trong khoảng này.</div>'}</section></div>
  <div class="grid g2" style="margin-top:14px">
    <section class="card"><div class="k">Sức khoẻ hệ thống</div><div class="kv">
      <span>Phiên bản</span><span class="mono">${esc(H.version)} · Python ${esc(H.python)}</span><span>Đã chạy</span><span>${dur(H.uptime_s)}</span>
      <span>Core agent</span><span>${ag ? `${esc(ag.name)} · ${esc(ag.engine)} · ${pill(ag.status || "ready")}` : '<span class="err">chưa có</span>'}</span>
      <span>Cô lập agent</span><span>${H.sandbox ? pill("ok") : '<span class="err">chưa bật</span>'}</span><span>Xuất Word/PPT</span><span>${H.pandoc ? pill("ok") : '<span class="err">thiếu pandoc</span>'}</span>
      <span>Bảo trì</span><span>${H.maintenance ? '<span class="pill warn">đang bật</span>' : "tắt"}</span></div>${owner ? '<a href="#agents">Quản lý core agent →</a>' : ""}</section>
    <section class="card"><div class="k">Dung lượng dữ liệu</div><div class="funnel" style="margin-top:10px">${[["Dự án (workspace)", st.workspace], ["Lịch sử phiên bản", st.history], ["Cơ sở dữ liệu", st.db], ["Tài khoản agent", st.agents], ["Tạm của job", st.jobs_tmp]].map(([l, n]) => {
        const tot = st.workspace + st.history + st.db + st.agents + st.jobs_tmp || 1; return `<div class="fr"><span>${l}</span><span class="fb" style="width:${n / tot * 100}%"></span><span class="hint">${bytes(n)}</span></div>`; }).join("")}</div>
      <p class="hint" style="margin:8px 0 0">Ổ đĩa: còn ${bytes(st.disk_free)} / ${bytes(st.disk_total)}.${owner ? ' <a href="#settings">Sao lưu dữ liệu →</a>' : ""}</p></section></div>
  <section class="card" style="margin-top:14px"><div class="row"><div class="k grow">Job gần đây</div><a href="#jobs" class="hint">Tất cả job →</a></div>${jobTable(o.recent_jobs)}</section></div>`;
  $$("input[name=rng]").forEach(r => r.onchange = () => { A.days = +r.value; overview(); });
  $("#csv").onclick = e => menu(e.currentTarget, [["Người dùng (.csv)", () => location.href = "/api/admin/export/users.csv"], ["Job (.csv)", () => location.href = "/api/admin/export/jobs.csv"],
    ["Mức dùng token (.csv)", () => location.href = "/api/admin/export/usage.csv"], ["Nhật ký thao tác (.csv)", () => location.href = "/api/admin/export/audit.csv"]]);
}
function funnelView(f) {
  const steps = [["signup", "Đăng ký"], ["key", "Thêm API key"], ["project", "Tạo dự án"], ["plan", "Chạy Plan xong"], ["share", "Chia sẻ hồ sơ"]], max = Math.max(1, f.signup);
  if (!f.signup) return '<p class="hint">Chưa có người dùng thường. <a href="#users">Mời người dùng đầu tiên →</a></p>';
  return `<div class="funnel" style="margin-top:10px">${steps.map(([k, l]) => `<div class="fr"><span>${l}</span><span class="fb" style="width:${f[k] / max * 100}%"></span><span class="hint">${f[k]} · ${Math.round(f[k] / max * 100)}%</span></div>`).join("")}</div>
    <p class="hint" style="margin:8px 0 0">Bước rơi nhiều nhất là nơi cần cải thiện trải nghiệm.</p>`;
}
function jobTable(rows, actions) {
  return `<div class="scroll-x"><table class="t"><thead><tr><th>#</th><th>Trạng thái</th><th>Dự án</th><th>Người dùng</th><th>Agent</th><th>Chi phí do</th><th>Tạo lúc</th>${actions ? "<th></th>" : ""}</tr></thead><tbody>
  ${rows.map(j => `<tr><td>${j.id}</td><td>${pill(j.status)}${j.error ? `<div class="hint err">${esc(j.error)}</div>` : ""}</td><td>${j.kind === "install" ? `<i>cài ${esc(j.engine)}</i>` : esc(j.name || "—")}<div class="hint">${esc(j.slug || "")}</div></td>
  <td>${esc(j.email || "")}</td><td>${esc(ENGINE[j.engine] || j.engine || "—")}${j.profile ? `<div class="hint">${esc(j.profile)}</div>` : ""}</td><td>${esc(BILL[j.billing] || "—")}</td><td class="hint">${when(j.created)}</td>
  ${actions ? `<td class="actions"><button class="sm" data-log="${j.id}" type="button">Xem log</button>${["queued", "starting", "running", "waiting"].includes(j.status) ? `<button class="sm ghost danger" data-cancel="${j.id}" type="button">Huỷ</button>` : j.kind === "plan" ? `<button class="sm ghost" data-retry="${j.id}" type="button">Chạy lại</button>` : ""}</td>` : ""}</tr>`).join("") || emptyRow(8, "Chưa có lượt chạy nào.")}</tbody></table></div>`;
}

// ---------------------------------------------------------------- users
async function users() {
  const [us, inv] = await Promise.all([api("/admin/users"), api("/admin/invites")]), owner = A.me.role === "owner";
  A.uf ??= {q: "", role: "", status: ""};
  const pending = inv.filter(i => !i.used_by && !i.revoked && (!i.expires || i.expires > new Date().toISOString()));
  $("#main").innerHTML = topbar("Người dùng", `${us.length} tài khoản · ${us.filter(u => u.status === "active").length} đang hoạt động · ${pending.length} lời mời đang chờ`,
    `<button class="pri" id="invBtn" type="button">＋ Mời người dùng</button>`) + `<div class="body">
    <section class="card" id="invPanel" hidden></section>
    <div class="toolbar"><input id="uq" aria-label="Tìm người dùng" placeholder="Tìm theo tên hoặc email…" value="${esc(A.uf.q)}" style="min-width:240px">
      <select id="ur2" aria-label="Lọc theo vai trò"><option value="">Mọi vai trò</option>${Object.entries(ROLE).map(([k, v]) => `<option value="${k}" ${A.uf.role === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      <select id="us2" aria-label="Lọc theo trạng thái"><option value="">Mọi trạng thái</option><option value="active" ${A.uf.status === "active" ? "selected" : ""}>Hoạt động</option><option value="disabled" ${A.uf.status === "disabled" ? "selected" : ""}>Đã khoá</option></select>
      <span class="grow"></span><span class="hint">Bấm vào một dòng để xem chi tiết · hạn mức để trống = mặc định hệ thống</span></div>
    <div class="card scroll-x"><table class="t"><thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th>Bắt đầu</th><th class="num">Dự án</th><th class="num">Job hệ thống / tháng</th><th class="num">Token tháng</th><th>Hoạt động</th></tr></thead><tbody id="urows"></tbody></table></div>
    ${pending.length || inv.length ? `<div class="card scroll-x" style="margin-top:14px"><h2>Lời mời</h2><table class="t"><thead><tr><th>Gửi cho</th><th>Vai trò</th><th>Trạng thái</th><th>Hết hạn</th><th></th></tr></thead><tbody>
    ${inv.slice(0, 30).map(i => { const st = i.used_by ? "used" : i.revoked ? "revoked" : i.expires < new Date().toISOString() ? "expired" : "open";
      return `<tr><td>${esc(i.email || "Link mở (ai có link đều đăng ký được)")}${i.note ? `<div class="hint">${esc(i.note)}</div>` : ""}</td><td>${ROLE[i.role]}</td>
      <td>${pill(st)}${st === "used" ? ` <span class="hint">${esc(i.used_email || "")}</span>` : ""}</td>
      <td class="hint">${i.expires ? new Date(i.expires).toLocaleDateString("vi-VN") : "—"}</td>
      <td class="actions">${st === "open" ? `<button class="sm" data-icopy="${esc(i.token)}" type="button">Sao chép link</button><button class="sm ghost danger" data-irev="${i.id}" type="button">Thu hồi</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>` : ""}</div>`;
  const draw = () => { const f = A.uf, q = f.q.toLowerCase();
    const rows = us.filter(u => (!q || (u.name + " " + u.email).toLowerCase().includes(q)) && (!f.role || u.role === f.role) && (!f.status || u.status === f.status));
    $("#urows").innerHTML = rows.map(u => `<tr class="click" data-u="${u.id}"><td><b>${esc(u.name)}</b><div class="hint">${esc(u.email)}${u.google ? " · Google" : ""}</div></td>
      <td>${ROLE[u.role]}</td><td>${pill(u.status)}</td>
      <td>${u.onboarding ? `<div class="meter" style="width:80px" title="${u.onboarding.done}/${u.onboarding.total} bước bắt đầu"><i style="width:${u.onboarding.done / u.onboarding.total * 100}%"></i></div><span class="hint">${u.onboarding.done}/${u.onboarding.total}</span>` : ""}</td>
      <td class="num">${u.quota.projects}${u.quota.projects_limit != null ? ` / ${u.quota.projects_limit}` : ""}</td>
      <td class="num">${u.quota.owner_jobs_month}${u.quota.owner_jobs_limit != null ? ` / ${u.quota.owner_jobs_limit}` : ""}</td>
      <td class="num">${tok(u.tokens_month)}</td><td class="hint">${when(u.last_login)}</td></tr>`).join("") || emptyRow(8, "Không có người dùng khớp bộ lọc.");
    $$("tr[data-u]").forEach(tr => tr.onclick = () => userDrawer(+tr.dataset.u)); };
  $("#uq").oninput = e => { A.uf.q = e.target.value; draw(); };
  $("#ur2").onchange = e => { A.uf.role = e.target.value; draw(); };
  $("#us2").onchange = e => { A.uf.status = e.target.value; draw(); };
  $("#invBtn").onclick = () => { const p = $("#invPanel"); p.hidden = !p.hidden; if (!p.hidden) invitePanel(owner); };
  $$("[data-icopy]").forEach(b => b.onclick = () => copyText(inviteUrl(b.dataset.icopy)));
  $$("[data-irev]").forEach(b => b.onclick = async () => { if (await ask("Thu hồi lời mời này?", "Thu hồi")) { await api("/admin/invites/" + b.dataset.irev, {method: "DELETE"}); toast("Đã thu hồi lời mời"); users(); } });
  draw();
}
const inviteUrl = t => `${location.origin}/login?invite=${encodeURIComponent(t)}`;
function copyText(t) { navigator.clipboard?.writeText(t).then(() => toast("Đã sao chép link"), () => toast(t)) ?? toast(t); }
function invitePanel(owner) {
  const p = $("#invPanel");
  p.innerHTML = `<div class="row"><h2 class="grow" style="margin:0">Mời người dùng</h2><button class="sm ghost" id="invX" type="button">Đóng</button></div>
    <p class="hint">Tạo link mời — người nhận tự đặt mật khẩu. Link dùng được một lần, kể cả khi hệ thống đang tắt tự đăng ký.</p>
    <form id="invF" class="grid g2" style="gap:0 12px"><div><label for="ie">Email (để trống = link mở cho bất kỳ ai)</label><input id="ie" type="email" placeholder="ten@congty.vn"></div>
      <div><label for="ir">Vai trò</label><select id="ir"><option value="user">Người dùng</option>${owner ? '<option value="admin">Admin</option>' : ""}</select></div>
      <div><label for="ip">Số dự án tối đa</label><input id="ip" type="number" min="0" placeholder="mặc định hệ thống"></div>
      <div><label for="ij">Lần chạy Plan bằng tài khoản hệ thống / tháng</label><input id="ij" type="number" min="0" placeholder="mặc định hệ thống"></div>
      <div><label for="id2">Hết hạn sau (ngày)</label><input id="id2" type="number" min="1" max="90" value="7"></div>
      <div><label for="in">Ghi chú</label><input id="in" placeholder="Ví dụ: founder chương trình ươm tạo đợt 3"></div>
      <div style="grid-column:1/-1" class="row"><button class="pri">Tạo link mời</button><span class="err" id="imsg"></span></div></form><div id="invOut"></div>`;
  $("#invX").onclick = () => p.hidden = true;

async function profAction(p, a, btn) {

    if (a === "check") { btn.textContent = "…"; const r = await api(P + "/check", {method: "POST"}); toast(r.ok ? "OK · " + r.output.split("\n")[0] : r.output); }
    if (a === "models") { btn.textContent = "…"; const r = await api(P + "/models", {method: "POST"}); toast(r.models.length ? `${r.models.length} model` : (r.output || "Không đọc được danh sách").slice(0, 160)); }

      await api(P + "/terminal", {body: {action: a}}); return openTerm(p, a); }
    if (a === "key") { const k = await askText(p.auth_mode === "account" ? "Dán token mà `claude setup-token` in ra sau khi đăng nhập" : "API key mới", "", "password"); if (!k) return; await api(P, {method: "PATCH", body: {key: k}}); }
    if (a === "reset") await api(P, {method: "PATCH", body: {reset_status: true}});
    if (a === "toggle") { await api(P, {method: "PATCH", body: {enabled: !p.enabled}}); toast(p.enabled ? `Đã tắt ${p.name}${p.is_active ? " — job mới chuyển sang tài khoản kế tiếp" : ""}` : `Đã bật ${p.name}`); }

  } catch (x) { toast(x.message); }

}
function openTerm(p, action) {
  clearInterval(A.poll); const c = $("#termc"); c.hidden = false; $("#tt").textContent = `Terminal · ${p.name}${action ? " · " + action : ""}`;
  const P = "/admin/agents/" + p.id + "/terminal";
  const tick = async () => { if (!$("#tout")) return clearInterval(A.poll); const v = await api(P); const o = $("#tout"), end = o.scrollTop + o.clientHeight >= o.scrollHeight - 30;
    o.textContent = v.output || "Đang khởi động…"; if (end) o.scrollTop = o.scrollHeight;
    $("#turls").innerHTML = v.urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("");
    if (!v.alive) { clearInterval(A.poll); $("#tt").textContent += " · đã đóng"; } };
  $("#tin").onsubmit = async e => { e.preventDefault(); await api(P + "/input", {body: {text: $("#ttext").value}}); $("#ttext").value = ""; };
  $$("#tin [data-key]").forEach(b => b.onclick = () => api(P + "/input", {body: {text: JSON.parse('"' + b.dataset.key + '"'), enter: false}}));
  $("#tstop").onclick = async () => { await api(P + "/stop", {method: "POST"}); clearInterval(A.poll); agents(); };
  tick(); A.poll = setInterval(tick, 1200); c.scrollIntoView({behavior: "smooth"});
}

// ---------------------------------------------------------------- usage
async function usage() {
  const u = await api("/admin/usage");
  const tbl = (rows, cols) => `<table class="t"><thead><tr>${cols.map(c => `<th class="${c[2] || ""}">${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c[2] || ""}">${c[1](r)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="hint">Chưa có dữ liệu.</td></tr>`}</tbody></table>`;
  $("#main").innerHTML = topbar("Mức dùng AI", "Tháng này · token đọc từ phản hồi của API / CLI") + `<div class="body"><div class="grid g2">
  <div class="card"><h2>Tài khoản hệ thống (core agent)</h2>${tbl(u.by_profile, [["Tài khoản agent", r => esc(r.name) + `<div class="hint">${esc(ENGINE[r.engine] || r.engine)}</div>`], ["Vào", r => tok(r.i), "num"], ["Ra", r => tok(r.o), "num"], ["Chi phí ước", r => r.c ? "$" + r.c.toFixed(2) : "—", "num"], ["Lượt", r => r.n, "num"]])}
  <p class="hint">Quota thật của tài khoản (gói, tín dụng còn lại) chỉ đọc được trong TUI: vào <a href="#agents">Core agent</a> → <b>Xem quota</b>.</p></div>
  <div class="card"><h2>Theo người dùng</h2>${tbl(u.by_user, [["Người dùng", r => esc(r.email)], ["Loại", r => r.source === "chat" ? "chat (key user)" : "job"], ["Vào", r => tok(r.i), "num"], ["Ra", r => tok(r.o), "num"], ["Lượt", r => r.n, "num"]])}</div>
  <div class="card"><h2>Theo nhà cung cấp / model</h2>${tbl(u.by_provider, [["Nhà cung cấp", r => esc(r.provider)], ["Model", r => esc(r.model || "—")], ["Vào", r => tok(r.i), "num"], ["Ra", r => tok(r.o), "num"], ["Lượt", r => r.n, "num"]])}</div></div></div>`;
}

// ---------------------------------------------------------------- settings (owner)
async function settings() {
  const s = await api("/admin/settings");
  const f = (k, l, t = "text", h = "", ph = "") => `<div><label for="s_${k}">${l}</label><input id="s_${k}" data-k="${k}" type="${t}" value="${esc(s[k])}" placeholder="${esc(ph)}">${h ? `<div class="hint">${h}</div>` : ""}</div>`;
  const sel = (k, l, opts, h = "") => `<div><label for="s_${k}">${l}</label><select id="s_${k}" data-k="${k}">${opts.map(([v, t]) => `<option value="${v}" ${s[k] === v ? "selected" : ""}>${t}</option>`).join("")}</select>${h ? `<div class="hint">${h}</div>` : ""}</div>`;
  const yn = [["1", "Bật"], ["0", "Tắt"]];
  $("#main").innerHTML = topbar("Cài đặt hệ thống", "Thay đổi có hiệu lực ngay cho mọi người dùng") + `<div class="body"><div class="settings"><nav class="subnav" aria-label="Mục cài đặt">${[["s-general", "Chung"], ["s-access", "Đăng ký & truy cập"], ["s-plan", "Chạy Plan & hạn mức"], ["s-ops", "Vận hành"], ["s-backup", "Sao lưu"]]
    .map(([id, l], i) => `<button type="button" data-jump="${id}" class="${i ? "" : "on"}">${l}</button>`).join("")}</nav><div><form id="sf" class="grid">
  <section class="card" id="s-general"><h2>Chung</h2><div class="grid g2" style="gap:0 14px">${f("site_name", "Tên hệ thống")}${f("support_email", "Email hỗ trợ", "email", "Hiện cho người dùng khi gặp lỗi hoặc cần trợ giúp", "hotro@congty.vn")}
    ${f("public_base_url", "URL công khai", "url", "Dùng cho Google OAuth và link chia sẻ, ví dụ https://plan.afi.io")}${f("default_country", "Thị trường mặc định", "text", "Cho dự án mới khi người dùng chưa chọn")}</div></section>
  <section class="card" id="s-access"><h2>Đăng ký & truy cập</h2><div class="grid g2" style="gap:0 14px">${sel("allow_signup", "Tự đăng ký", [["1", "Mở — ai có link cũng đăng ký được"], ["0", "Chỉ qua lời mời"]])}
    ${f("signup_domains", "Chỉ cho tên miền email", "text", "Bỏ trống = mọi email. Ví dụ: afi.io, congty.vn — người ngoài vẫn vào được bằng lời mời", "afi.io, congty.vn")}</div>
    <h3 style="margin:16px 0 4px">Đăng nhập Google (tuỳ chọn)</h3><p class="hint">Tạo OAuth Client (Web) ở Google Cloud Console, redirect URI: <code>${esc((s.public_base_url || location.origin) + "/api/auth/google/callback")}</code></p>
    <div class="grid g2" style="gap:0 14px">${f("google_client_id", "Client ID")}<div><label for="gcs">Client secret</label><input id="gcs" type="password" placeholder="${s.google_client_secret_set ? "đã lưu — nhập để thay" : ""}" autocomplete="off">
      ${s.google_client_secret_set ? '<label class="row hint" style="margin-top:6px"><input type="checkbox" id="gcsClear" style="width:auto"> Xoá secret đã lưu (tắt đăng nhập Google)</label>' : ""}</div></div></section>
  <section class="card" id="s-plan"><h2>Chạy Plan & hạn mức</h2><div class="grid g2" style="gap:0 14px">
    ${sel("plan_billing", "Ai trả chi phí chạy Plan", [["either", "Người dùng chọn: tài khoản hệ thống hoặc key riêng"], ["owner", "Chỉ tài khoản hệ thống (core agent)"], ["user_key", "Chỉ API key của người dùng"]])}
    ${f("default_quota_jobs_month", "Lần chạy bằng tài khoản hệ thống / người dùng / tháng", "number")}${f("default_quota_projects", "Số dự án tối đa / người dùng", "number")}
    ${f("job_timeout_min", "Thời gian tối đa mỗi job (phút)", "number")}${f("max_concurrent_jobs", "Số job chạy song song", "number", "1–16; mỗi job là một core agent đang chạy")}
    ${sel("auto_failover", "Tự chuyển tài khoản agent khi hết quota", yn)}${sel("allow_demo_engine", "Chế độ demo (không cần key)", yn, "Cho người mới thử luồng; hồ sơ demo có cảnh báo khi chia sẻ")}</div></section>
  <section class="card" id="s-ops"><h2>Vận hành</h2><div class="grid g2" style="gap:0 14px">
    ${sel("maintenance", "Chế độ bảo trì", [["0", "Tắt"], ["1", "Bật — người dùng chỉ xem, không tạo/chạy/sửa"]], "Admin vẫn thao tác bình thường; job đang chạy không bị dừng")}
    ${f("log_retention_days", "Giữ log job (ngày)", "number", "0 = giữ mãi. Log cũ bị xoá nội dung, thống kê vẫn giữ")}
    <div style="grid-column:1/-1"><label for="s_announcement">Thông báo cho mọi người dùng</label><textarea id="s_announcement" data-k="announcement" rows="2" maxlength="500" placeholder="Ví dụ: Tối 25/10 bảo trì 22:00–23:00. Bỏ trống = không hiện.">${esc(s.announcement)}</textarea></div>
    ${sel("announcement_level", "Mức thông báo", [["info", "Thông tin"], ["warn", "Cảnh báo"]])}</div></section>
  <div class="savebar-static sticky-save"><button class="pri">Lưu cài đặt</button> <span class="hint" id="smsg">Thay đổi chưa lưu sẽ mất khi rời trang.</span></div></form>
  <section class="card" id="s-backup" style="margin-top:14px"><h2>Sao lưu dữ liệu</h2><p class="hint">Một file .zip gồm cơ sở dữ liệu, khoá mã hoá API key, mọi dự án và lịch sử phiên bản — đủ để dựng lại hệ thống trên máy khác (xem RESTORE.txt trong file).
    <b>File chứa khoá giải mã API key của người dùng — cất như mật khẩu.</b> Tài khoản core agent cần đăng nhập lại sau khi khôi phục.</p>
    <button type="button" id="bk">${icon("download")}Tải bản sao lưu</button></section></div></div></div>`;
  $$("[data-jump]").forEach(b => b.onclick = () => { $$("[data-jump]").forEach(x => x.classList.toggle("on", x === b)); $("#" + b.dataset.jump).scrollIntoView({behavior: "smooth", block: "start"}); });
  $("#sf").onsubmit = async e => { e.preventDefault(); const b = {}; $$("[data-k]").forEach(i => b[i.dataset.k] = i.value); if ($("#gcs").value) b.google_client_secret = $("#gcs").value;
    if ($("#gcsClear")?.checked) b.clear_google_client_secret = true;
    try { await api("/admin/settings", {method: "PUT", body: b}); toast("Đã lưu cài đặt"); settings(); }
    catch (x) { $("#smsg").textContent = "✗ " + x.message; $("#smsg").className = "err"; toast("Chưa lưu: " + x.message); } };
  $("#bk").onclick = async () => { if (!await ask("Tải bản sao lưu toàn hệ thống? File chứa khoá giải mã API key — chỉ lưu ở nơi an toàn.", "Tải sao lưu", false)) return;
    location.href = "/api/admin/backup"; toast("Đang đóng gói bản sao lưu…"); };
}
